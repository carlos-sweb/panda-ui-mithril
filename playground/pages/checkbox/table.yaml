rows:
  - class: "checkbox"
    prop: "<Checkbox>"
    type: "Component"
    description: "Checkbox"
  - class: "checkbox-primary"
    prop: "color=\"primary\""
    type: "Color"
    description: "primary color"
  - class: "checkbox-secondary"
    prop: "color=\"secondary\""
    type: "Color"
    description: "secondary color"
  - class: "checkbox-accent"
    prop: "color=\"accent\""
    type: "Color"
    description: "accent color"
  - class: "checkbox-neutral"
    prop: "color=\"neutral\""
    type: "Color"
    description: "neutral color"
  - class: "checkbox-success"
    prop: "color=\"success\""
    type: "Color"
    description: "success color"
  - class: "checkbox-warning"
    prop: "color=\"warning\""
    type: "Color"
    description: "warning color"
  - class: "checkbox-info"
    prop: "color=\"info\""
    type: "Color"
    description: "info color"
  - class: "checkbox-error"
    prop: "color=\"error\""
    type: "Color"
    description: "error color"
  - class: "checkbox-xs"
    prop: "size=\"xs\""
    type: "Size"
    description: "Extra small size"
  - class: "checkbox-sm"
    prop: "size=\"sm\""
    type: "Size"
    description: "Small size"
  - class: "checkbox-md"
    prop: "size=\"md\" (default)"
    type: "Size"
    description: "Medium size"
    default: true
  - class: "checkbox-lg"
    prop: "size=\"lg\""
    type: "Size"
    description: "Large size"
  - class: "checkbox-xl"
    prop: "size=\"xl\""
    type: "Size"
    description: "Extra large size"
