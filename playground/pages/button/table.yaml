rows:
  - class: "btn"
    prop: "<Button>"
    type: "Component"
    description: "Button"
  - class: "btn-neutral"
    prop: "color=\"neutral\""
    type: "Color"
    description: "neutral color"
  - class: "btn-primary"
    prop: "color=\"primary\""
    type: "Color"
    description: "primary color"
  - class: "btn-secondary"
    prop: "color=\"secondary\""
    type: "Color"
    description: "secondary color"
  - class: "btn-accent"
    prop: "color=\"accent\""
    type: "Color"
    description: "accent color"
  - class: "btn-info"
    prop: "color=\"info\""
    type: "Color"
    description: "info color"
  - class: "btn-success"
    prop: "color=\"success\""
    type: "Color"
    description: "success color"
  - class: "btn-warning"
    prop: "color=\"warning\""
    type: "Color"
    description: "warning color"
  - class: "btn-error"
    prop: "color=\"error\""
    type: "Color"
    description: "error color"
  - class: "btn-outline"
    prop: "variant=\"outline\""
    type: "Style"
    description: "outline style"
  - class: "btn-dash"
    prop: "variant=\"dash\""
    type: "Style"
    description: "dash style"
  - class: "btn-soft"
    prop: "variant=\"soft\""
    type: "Style"
    description: "soft style"
  - class: "btn-ghost"
    prop: "variant=\"ghost\""
    type: "Style"
    description: "ghost style"
  - class: "btn-link"
    prop: "variant=\"link\""
    type: "Style"
    description: "looks like a link"
  - class: "btn-active"
    prop: "active"
    type: "Behavior"
    description: "looks active"
  - class: "btn-disabled"
    prop: "disabled"
    type: "Behavior"
    description: "looks disabled — pass className=\"btn-disabled\" instead if you need it to still be clickable"
  - class: "btn-xs"
    prop: "size=\"xs\""
    type: "Size"
    description: "Extra small size"
  - class: "btn-sm"
    prop: "size=\"sm\""
    type: "Size"
    description: "Small size"
  - class: "btn-md"
    prop: "size=\"md\" (default)"
    type: "Size"
    description: "Medium size"
    default: true
  - class: "btn-lg"
    prop: "size=\"lg\""
    type: "Size"
    description: "Large size"
  - class: "btn-xl"
    prop: "size=\"xl\""
    type: "Size"
    description: "Extra large size"
  - class: "btn-wide"
    prop: "wide"
    type: "Modifier"
    description: "more horizontal padding"
  - class: "btn-block"
    prop: "block"
    type: "Modifier"
    description: "Full width"
  - class: "btn-square"
    prop: "square"
    type: "Modifier"
    description: "1:1 ratio"
  - class: "btn-circle"
    prop: "circle"
    type: "Modifier"
    description: "1:1 ratio with rounded corners"
  - class: "btn-border-1"
    prop: "borderWidth={1} (default)"
    type: "Modifier"
    description: "1px border"
    default: true
  - class: "btn-border-2"
    prop: "borderWidth={2}"
    type: "Modifier"
    description: "2px border"
  - class: "btn-border-3"
    prop: "borderWidth={3}"
    type: "Modifier"
    description: "3px border"
