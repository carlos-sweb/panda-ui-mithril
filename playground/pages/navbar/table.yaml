rows:
  - class: "navbar"
    prop: "<Navbar>"
    type: "Component"
    description: "Navbar container (position, color, size, border, shadow, glass, container)"
  - class: "navbar-start"
    prop: "<NavbarStart>"
    type: "Part"
    description: "Left side of the navbar (50% width)"
  - class: "navbar-center"
    prop: "<NavbarCenter>"
    type: "Part"
    description: "Middle of the navbar (shrink-to-fit)"
  - class: "navbar-end"
    prop: "<NavbarEnd>"
    type: "Part"
    description: "Right side of the navbar (50% width)"
  - class: "navbar-brand"
    prop: "<NavbarBrand>"
    type: "Part"
    description: "Logo/title link (Bootstrap navbar-brand pattern)"
  - class: "navbar-menu"
    prop: "<NavbarMenu>"
    type: "Part"
    description: "Desktop link group (hidden below 768px)"
  - class: "navbar-link"
    prop: "<NavbarLink>"
    type: "Part"
    description: "Nav item with active/disabled state"
  - class: "navbar-toggle"
    prop: "<NavbarToggle>"
    type: "Part"
    description: "Mobile hamburger (hidden on desktop); Menu/X icon swap"
  - class: "navbar-container"
    prop: "container"
    type: "Behavior"
    description: "Wrap content in a max-width centered container (--navbar-max-w)"
  - class: "navbar--position_sticky"
    prop: "position"
    type: "Style"
    description: "static | sticky | fixed (z-index 50)"
  - class: "navbar--color_primary"
    prop: "color"
    type: "Color"
    description: "base + PumColor semantic colors (--navbar-bg / --navbar-fg)"
  - class: "navbar--size_sm"
    prop: "size"
    type: "Size"
    description: "sm (3rem) | md (4rem) | lg (5rem)"
  - class: "navbar--border_true"
    prop: "border"
    type: "Modifier"
    description: "Bottom border (base-300)"
  - class: "navbar--shadow_sm"
    prop: "shadow"
    type: "Style"
    description: "none | sm | md | lg drop shadow"
  - class: "navbar--glass_true"
    prop: "glass"
    type: "Modifier"
    description: "Translucent background + backdrop blur"
  - class: "navbar-link--active_true"
    prop: "active"
    type: "Behavior"
    description: "Highlight current page (pill + aria-current)"
  - class: "navbar-link--disabled_true"
    prop: "disabled"
    type: "Behavior"
    description: "Dimmed, no pointer events"
