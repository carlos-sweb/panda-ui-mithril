rows:
  - class: "cally"
    prop: "<Calendar value={...} onchange={...}>"
    type: "Component"
    description: "Month-grid calendar with real date logic (navigable, no external library)"
  - class: "calendar-header"
    prop: "(internal)"
    type: "Part"
    description: "Month/year label with previous/next navigation"
  - class: "calendar-month"
    prop: "(internal)"
    type: "Part"
    description: "The 7-column weekday + day grid"
  - class: "calendar-date"
    prop: "(internal)"
    type: "Part"
    description: "A single day cell — today is highlighted primary, the selected value is highlighted solid"
