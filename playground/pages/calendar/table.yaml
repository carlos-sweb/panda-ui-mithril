rows:
  - class: "cally"
    prop: "<Calendar value={...} onchange={...}>"
    type: "Component"
    description: "Month-grid calendar with real date logic (navigable, no external library)"
  - class: "calendar-header"
    prop: "(internal)"
    type: "Part"
    description: "Month/year label with previous/next navigation"
  - class: "calendar-month"
    prop: "(internal)"
    type: "Part"
    description: "The 7-column weekday + day grid"
  - class: "calendar-date"
    prop: "(internal)"
    type: "Part"
    description: "A single day cell — today is highlighted primary, the selected value is highlighted solid. In range mode also carries the range-start/range-end/in-range styling."
  - class: "(internal)"
    prop: "mode=\"single\" | \"range\" | \"multiple\""
    type: "Attribute"
    description: "Selection mode — controls the shape of value/onchange (Date, { start, end }, or Date[])"
  - class: "(internal)"
    prop: "showWeekNumbers"
    type: "Attribute"
    description: "Adds an ISO-8601 week-number column to the day grid"
  - class: "(internal)"
    prop: "initialView=\"day\" | \"month\" | \"year\""
    type: "Attribute"
    description: "Starting drill-down view, read once on init"
  - class: "(internal)"
    prop: "(internal)"
    type: "Part"
    description: "Clicking the header title drills day → month → year; the month/year picker grids reuse the same day-cell visual language"
