class: "chat-image"
rows:
  - class: "chat"
    prop: "<Chat placement=\"...\">"
    type: "Component"
    description: "Chat container (basic)"
  - prop: "<ChatImage>"
    type: "Part"
    description: "Container for an avatar image"
  - class: "chat-header"
    prop: "<ChatHeader>"
    type: "Part"
    description: "Header for the chat bubble"
  - class: "chat-bubble"
    prop: "<ChatBubble color=\"...\">"
    type: "Component"
    description: "The chat bubble itself"
  - class: "chat-footer"
    prop: "<ChatFooter>"
    type: "Part"
    description: "Footer for the chat bubble"
  - class: "chat-window"
    prop: "<ChatWindow>"
    type: "Component"
    description: "Full chat container with fixed header/footer"
  - class: "chat-message"
    prop: "<ChatMessage>"
    type: "Component"
    description: "Complete message with bubble, status, reactions"
  - class: "chat-reply"
    prop: "<ChatReply>"
    type: "Component"
    description: "Reply/quote to a previous message"
  - class: "chat-reactions"
    prop: "<ChatReactions>"
    type: "Component"
    description: "Emoji reactions for a message"
  - class: "chat-status"
    prop: "<ChatStatus>"
    type: "Component"
    description: "Read receipt indicators"
  - class: "chat-audio"
    prop: "<ChatAudio>"
    type: "Component"
    description: "Audio player for voice messages"
  - class: "chat-video"
    prop: "<ChatVideo>"
    type: "Component"
    description: "Inline video player"
  - prop: "<ChatImageMessage>"
    type: "Component"
    description: "Image message with caption"
  - class: "chat-file"
    prop: "<ChatFile>"
    type: "Component"
    description: "File attachment with icon"
  - class: "chat-link"
    prop: "<ChatLink>"
    type: "Component"
    description: "URL preview with title/description"
  - class: "chat-system"
    prop: "<ChatSystem>"
    type: "Component"
    description: "System messages (dates, info)"
  - class: "chat-input"
    prop: "<ChatInput>"
    type: "Component"
    description: "Message input area"
  - class: "chat-typing"
    prop: "<ChatTyping>"
    type: "Component"
    description: "Typing indicator"
  - class: "chat-emoji"
    prop: "<ChatEmoji>"
    type: "Component"
    description: "Emoji selector grid"
  - class: "chat-start"
    prop: "placement=\"start\" (default)"
    type: "Placement"
    description: "Bubble on the left"
    default: true
  - class: "chat-end"
    prop: "placement=\"end\""
    type: "Placement"
    description: "Bubble on the right"
