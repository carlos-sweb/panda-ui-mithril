paragraph: Componente de menú para menús de navegación y barras laterales.
autoActiveDescription: "Cuando autoActive es true, el Menu gestiona automáticamente qué ítem está activo al hacer click. No necesitas manejar el estado manualmente."
callbackDescription: "Usa onActiveChange para recibir una notificación cuando cambia el ítem activo. Útil para sincronizar con el router o estado externo."
verticalDefault: Vertical (por defecto)
horizontal: Horizontal
autoActive: Auto activo
autoActiveCallback: Auto activo + callback
autoActiveTitle: Auto activo
onActiveChangeTitle: Al cambiar activo
