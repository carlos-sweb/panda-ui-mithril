rows:
  - class: "menu"
    prop: "<Menu>"
    type: "Component"
    description: "Menu container"
  - class: "menu-title"
    prop: "<MenuTitle>"
    type: "Part"
    description: "Section title inside a menu"
  - class: "menu-dropdown"
    prop: "<MenuDropdown>"
    type: "Part"
    description: "Nested submenu list"
  - class: "menu-dropdown-toggle"
    prop: "<MenuDropdownToggle>"
    type: "Part"
    description: "Toggle link for a submenu"
  - class: "menu-active"
    prop: "<MenuItem active> / autoActive"
    type: "Modifier"
    description: "Highlights an item as active/selected"
  - class: "menu-disabled"
    prop: "<MenuItem disabled>"
    type: "Modifier"
    description: "Disables an item"
  - class: "menu-horizontal"
    prop: "horizontal"
    type: "Placement"
    description: "Shows the menu horizontally"
  - class: "menu-vertical"
    prop: "(default)"
    type: "Placement"
    description: "Shows the menu vertically"
    default: true
  - class: "menu-xs"
    prop: "size=\"xs\""
    type: "Size"
    description: "Extra small size"
  - class: "menu-sm"
    prop: "size=\"sm\""
    type: "Size"
    description: "Small size"
  - class: "menu-md"
    prop: "size=\"md\" (default)"
    type: "Size"
    description: "Medium size"
    default: true
  - class: "menu-lg"
    prop: "size=\"lg\""
    type: "Size"
    description: "Large size"
  - class: "menu-xl"
    prop: "size=\"xl\""
    type: "Size"
    description: "Extra large size"
  - prop: "autoActive"
    type: "Prop"
    description: "Menu tracks active item automatically on click"
  - prop: "defaultActive"
    type: "Prop"
    description: "Index of initially active item (with autoActive)"
  - prop: "onActiveChange"
    type: "Prop"
    description: "Callback fired when active item changes (index: number)"
