rows:
  # ── Props propios de ButtonCopy ─────────────────────────────────────────
  - class: "btn-copy"
    prop: "<ButtonCopy>"
    type: "Component"
    description: "Button that copies text to clipboard with a tooltip confirmation. Wraps Button — all Button props are supported."
  - class: "—"
    prop: "text=\"...\""
    type: "string"
    description: "Text string to copy to the clipboard"
  - class: "—"
    prop: "for=\"id\""
    type: "string"
    description: "ID of a DOM element whose textContent is copied (used when text is not provided)"
  - class: "—"
    prop: "tooltip=\"...\""
    type: "string"
    description: "Feedback label shown in a tooltip after copying (e.g. \"Copied!\"). When omitted, no Tooltip is rendered at all — just the bare Button."
  - class: "—"
    prop: "duration={2000}"
    type: "number"
    description: "Duration in ms the copied state persists. Default: 2000"
    default: true
  - class: "—"
    prop: "animation=\"scale\" (default)"
    type: "Animation"
    description: "Icon transition when Copy swaps to Check. Default: 'scale'"
    default: true
  - class: "—"
    prop: "animation=\"fade\""
    type: "Animation"
    description: "Icon fades in (opacity 0→1)"
  - class: "—"
    prop: "animation=\"scale\""
    type: "Animation"
    description: "Icon scales up from zero with fade (default)"
  - class: "—"
    prop: "animation=\"rotate\""
    type: "Animation"
    description: "Icon rotates in from -90° with fade"
  - class: "—"
    prop: "animation=\"bounce\""
    type: "Animation"
    description: "Icon overshoots scale for a springy feel"
  - class: "—"
    prop: "animation=\"none\""
    type: "Animation"
    description: "No animation — instant icon swap"
  # ── Colors (inherited from Button) ──────────────────────────────────────
  - class: "btn-neutral"
    prop: "color=\"neutral\""
    type: "Color"
    description: "neutral color"
  - class: "btn-primary"
    prop: "color=\"primary\""
    type: "Color"
    description: "primary color"
  - class: "btn-secondary"
    prop: "color=\"secondary\""
    type: "Color"
    description: "secondary color"
  - class: "btn-accent"
    prop: "color=\"accent\""
    type: "Color"
    description: "accent color"
  - class: "btn-info"
    prop: "color=\"info\""
    type: "Color"
    description: "info color"
  - class: "btn-success"
    prop: "color=\"success\""
    type: "Color"
    description: "success color"
  - class: "btn-warning"
    prop: "color=\"warning\""
    type: "Color"
    description: "warning color"
  - class: "btn-error"
    prop: "color=\"error\""
    type: "Color"
    description: "error color"
  # ── Variants (inherited from Button) ────────────────────────────────────
  - class: "btn-outline"
    prop: "variant=\"outline\""
    type: "Style"
    description: "outline style"
  - class: "btn-dash"
    prop: "variant=\"dash\""
    type: "Style"
    description: "dash style"
  - class: "btn-soft"
    prop: "variant=\"soft\""
    type: "Style"
    description: "soft style"
  - class: "btn-ghost"
    prop: "variant=\"ghost\""
    type: "Style"
    description: "ghost style"
  - class: "btn-link"
    prop: "variant=\"link\""
    type: "Style"
    description: "looks like a link"
  # ── Behavior (inherited from Button) ────────────────────────────────────
  - class: "btn-disabled"
    prop: "disabled"
    type: "Behavior"
    description: "looks disabled"
  # ── Sizes (inherited from Button) ────────────────────────────────────────
  - class: "btn-xs"
    prop: "size=\"xs\""
    type: "Size"
    description: "Extra small size"
  - class: "btn-sm"
    prop: "size=\"sm\""
    type: "Size"
    description: "Small size"
  - class: "btn-md"
    prop: "size=\"md\" (default)"
    type: "Size"
    description: "Medium size"
    default: true
  - class: "btn-lg"
    prop: "size=\"lg\""
    type: "Size"
    description: "Large size"
  - class: "btn-xl"
    prop: "size=\"xl\""
    type: "Size"
    description: "Extra large size"
  # ── Modifiers (inherited from Button) ────────────────────────────────────
  - class: "btn-wide"
    prop: "wide"
    type: "Modifier"
    description: "more horizontal padding"
  - class: "btn-block"
    prop: "block"
    type: "Modifier"
    description: "full width"
  - class: "btn-square"
    prop: "square"
    type: "Modifier"
    description: "1:1 ratio"
  - class: "btn-circle"
    prop: "circle"
    type: "Modifier"
    description: "1:1 ratio with rounded corners"
  - class: "btn-border-1"
    prop: "borderWidth={1} (default)"
    type: "Modifier"
    description: "1px border"
    default: true
  - class: "btn-border-2"
    prop: "borderWidth={2}"
    type: "Modifier"
    description: "2px border"
  - class: "btn-border-3"
    prop: "borderWidth={3}"
    type: "Modifier"
    description: "3px border"
