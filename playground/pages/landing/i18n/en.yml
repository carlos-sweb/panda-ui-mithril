  quickStartIntro: >-
    From an empty project to your first styled Button — verified end to end.
    The npm package can lag behind; this guide installs from GitHub.
  quickStartStep1Title: 1 · Install the dependencies
  quickStartStep1Desc: >-
    Install Panda first (the package runs <code>panda codegen</code> when
    installed from git), then the library and Mithril.
  quickStartStep2Title: 2 · Init the project
  quickStartStep2Desc: >-
    <code>bunx panda-ui-mithril init</code> creates the <code>pum/</code>
    folder with the editable theme, writes <code>panda.config.ts</code>
    (pointing to <code>./pum/preset</code>) and configures the Mithril JSX
    transform. It also migrates an old single-file theme automatically.
  quickStartStep3Title: 3 · Generate the helpers and the CSS
  quickStartStep3Desc: >-
    <code>bunx panda-ui-mithril init</code> does not run codegen — generate
    the helpers and <code>styles.css</code>.
  quickStartStep4Title: 4 · Hello world
  quickStartStep4Desc: >-
    The import uses the lowercase kebab subpath (<code>panda-ui-mithril/button</code>).
  quickStartStep5Run: >-
    Run with <code>bun index.html</code> and open <code>http://localhost:3000</code>.
  quickStartWhatInitTitle: What init does for you
  quickStartWhatInitIntro: >-
    The manual setup is automated by <code>bunx panda-ui-mithril init</code> —
    shown here so you know what to expect (or can configure it by hand).
  quickStartWhatInit1Title: 1 · pum/ — preset + editable theme
  quickStartWhatInit1Desc: >-
    Copies the library preset and the theme files (colors, fonts, spacing,
    radii, keyframes) into <code>pum/</code>. Recipes are NOT copied — they
    come from the package via <code>panda-ui-mithril/recipes</code>.
  quickStartWhatInit2Title: 2 · panda.config.ts → ./pum/preset
  quickStartWhatInit2Desc: >-
    Writes a config using the copied preset with
    <code>staticCss: { recipes: '*' }</code> (emits every recipe) and
    <code>outdir: styled-system</code>.
  quickStartWhatInit3Title: 3 · Mithril JSX
  quickStartWhatInit3Desc: >-
    No component needs a special transform (every component is plain
    <code>.js</code>): <code>init</code> merges the classic Mithril JSX fields into
    <code>tsconfig.json</code> so you can write JSX in your own app (the same fields
    work in <code>bunfig.toml</code>).

  cli: CLI
  cliIntro: >-
    Two commands: <code>init</code> scaffolds the project and <code>config</code>
    opens the theme editor. Both accept <code>--dir</code> (also
    <code>--dir=&lt;path&gt;</code>), so they work the same for a single project or for
    several independent SPAs inside one repo.
  cliInitTitle: init · scaffold the project
  cliInitDesc: >-
    Creates <code>pum/</code> (preset + editable theme),
    <code>panda.config.ts</code>, the Mithril JSX fields in
    <code>tsconfig.json</code> and the PostCSS pipeline. <code>--dir &lt;path&gt;</code>
    writes everything there (creating the directory); <code>--force</code>
    regenerates an existing project — <strong>it overwrites
    <code>pum/theme/*.ts</code> with the package defaults</strong>, so your
    colors/fonts are lost.
  cliConfigTitle: config · the theme editor
  cliConfigDesc: >-
    Opens the editor (Elysia server) on <code>http://localhost:1234</code>;
    <code>--port</code> changes the port, <code>--dir</code> points it at another
    project and <code>--no-open</code> starts it without launching the browser
    (repeated runs, scripts, CI).
  cliMultiSpaTitle: One repo, several independent SPAs
  cliMultiSpaDesc: >-
    Give each SPA (login, dashboard by role…) its own project, so it gets its
    own <code>pum/theme</code>, <code>panda.config.ts</code> and
    <code>styled-system/styles.css</code>.
    <code>config --init --dir=&lt;spa&gt;</code> initializes it if it is missing and
    opens the editor in one step — <strong>it never overwrites</strong>. A SPA
    without its own <code>panda.config.ts</code> cannot be built on its own: the
    editor refuses to write there (the rebuild would land in the parent
    project) and tells you to run <code>init --dir=&lt;spa&gt;</code>.
