rows:
  - class: "container"
    prop: "<Container>"
    type: "Component"
    description: "Responsive centered container with max-width"
  - class: "container-fullhd"
    prop: "maxWidth=\"fullhd\" (default)"
    type: "Size"
    description: "Max 1344px"
    default: true
  - class: "container-widescreen"
    prop: "maxWidth=\"widescreen\""
    type: "Size"
    description: "Max 1152px"
  - class: "container-desktop"
    prop: "maxWidth=\"desktop\""
    type: "Size"
    description: "Max 960px"
  - class: "container-tablet"
    prop: "maxWidth=\"tablet\""
    type: "Size"
    description: "Max 768px"
  - class: "container-fluid"
    prop: "fluid"
    type: "Modifier"
    description: "Full width with 2rem side padding"
