rows:
  - class: "swap"
    prop: "<Swap on={...} off={...}>"
    type: "Component"
    description: "Swap container"
  - class: "swap-on"
    prop: "on={...}"
    type: "Part"
    description: "The child element that should be visible when checkbox is checked or when swap is active"
  - class: "swap-off"
    prop: "off={...}"
    type: "Part"
    description: "The child element that should be visible when checkbox is not checked or when swap is not active"
  - class: "swap-indeterminate"
    type: "Part"
    description: "The child element that should be visible when checkbox is indeterminate — not supported by this component"
  - class: "swap-active"
    prop: "active"
    type: "Modifier"
    description: "Activates the swap (no need for checkbox)"
  - class: "swap-rotate"
    prop: "style=\"rotate\""
    type: "Style"
    description: "Adds rotate effect to swap"
  - class: "swap-flip"
    prop: "style=\"flip\""
    type: "Style"
    description: "Adds flip effect to swap"
  - class: "swap-xs"
    prop: "size=\"xs\""
    type: "Size"
    description: "Extra small size"
  - class: "swap-sm"
    prop: "size=\"sm\""
    type: "Size"
    description: "Small size"
  - class: "swap-md"
    prop: "size=\"md\" (default)"
    type: "Size"
    description: "Medium size"
    default: true
  - class: "swap-lg"
    prop: "size=\"lg\""
    type: "Size"
    description: "Large size"
  - class: "swap-xl"
    prop: "size=\"xl\""
    type: "Size"
    description: "Extra large size"
  - prop: "checked"
    type: "Prop"
    description: "Controlled state of the checkbox"
  - prop: "onchange"
    type: "Prop"
    description: "Callback on toggle: (checked, e) => void"
