rows:
  - class: "link"
    prop: "hover={false}"
    type: "Component"
    description: "Adds underline — note: this component defaults to hover=true, so pass hover={false} to always show the underline"
  - class: "link-hover"
    prop: "hover (default)"
    type: "Style"
    description: "Only shows underline on hover — this is the default, no prop needed"
    default: true
  - class: "link-neutral"
    prop: "color=\"neutral\""
    type: "Color"
    description: "neutral color"
  - class: "link-primary"
    prop: "color=\"primary\""
    type: "Color"
    description: "primary color"
  - class: "link-secondary"
    prop: "color=\"secondary\""
    type: "Color"
    description: "secondary color"
  - class: "link-accent"
    prop: "color=\"accent\""
    type: "Color"
    description: "accent color"
  - class: "link-success"
    prop: "color=\"success\""
    type: "Color"
    description: "success color"
  - class: "link-info"
    prop: "color=\"info\""
    type: "Color"
    description: "info color"
  - class: "link-warning"
    prop: "color=\"warning\""
    type: "Color"
    description: "warning color"
  - class: "link-error"
    prop: "color=\"error\""
    type: "Color"
    description: "error color"
