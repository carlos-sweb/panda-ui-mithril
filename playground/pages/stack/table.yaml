rows:
  - class: "stack"
    prop: "<Stack>"
    type: "Component"
    description: "Flex container that stacks children with gap"
  - class: "stack-column"
    prop: "direction=\"column\" (default)"
    type: "Direction"
    description: "Stack vertically"
    default: true
  - class: "stack-row"
    prop: "direction=\"row\""
    type: "Direction"
    description: "Stack horizontally"
  - class: "stack-xs|sm|md|lg|xl"
    prop: "gap=\"xs|sm|md|lg|xl\""
    type: "Size"
    description: "Gap between children. Scales with viewport."
  - class: "stack-align-*"
    prop: "align=\"start|center|end|stretch\""
    type: "Alignment"
    description: "Cross-axis alignment"
  - class: "stack-justify-*"
    prop: "justify=\"start|center|end|between|around\""
    type: "Alignment"
    description: "Main-axis justification"
