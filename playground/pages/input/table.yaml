rows:
  - class: "input"
    prop: "<TextInput>"
    type: "Component"
    description: "For <input type=\"text\"> tag or a wrapper of <input type=\"text\"> tag"
  - class: "input-ghost"
    prop: "ghost"
    type: "Style"
    description: "ghost style"
  - class: "input-neutral"
    prop: "color=\"neutral\""
    type: "Color"
    description: "neutral color"
  - class: "input-primary"
    prop: "color=\"primary\""
    type: "Color"
    description: "primary color"
  - class: "input-secondary"
    prop: "color=\"secondary\""
    type: "Color"
    description: "secondary color"
  - class: "input-accent"
    prop: "color=\"accent\""
    type: "Color"
    description: "accent color"
  - class: "input-info"
    prop: "color=\"info\""
    type: "Color"
    description: "info color"
  - class: "input-success"
    prop: "color=\"success\""
    type: "Color"
    description: "success color"
  - class: "input-warning"
    prop: "color=\"warning\""
    type: "Color"
    description: "warning color"
  - class: "input-error"
    prop: "color=\"error\""
    type: "Color"
    description: "error color"
  - class: "input-xs"
    prop: "size=\"xs\""
    type: "Size"
    description: "Extra small size"
  - class: "input-sm"
    prop: "size=\"sm\""
    type: "Size"
    description: "Small size"
  - class: "input-md"
    prop: "size=\"md\" (default)"
    type: "Size"
    description: "Medium size"
    default: true
  - class: "input-lg"
    prop: "size=\"lg\""
    type: "Size"
    description: "Large size"
  - class: "input-xl"
    prop: "size=\"xl\""
    type: "Size"
    description: "Extra large size"
