rows:
  - class: "columns"
    prop: "<Columns>"
    type: "Component"
    description: "Flexbox row container, wraps on mobile"
  - class: "columns-gap-sm|md|lg"
    prop: "gap=\"sm|md|lg\""
    type: "Size"
    description: "Gap between columns"
  - class: "columns-vertical"
    prop: "vertical"
    type: "Modifier"
    description: "Stack vertically"
  - class: "column"
    prop: "<Column>"
    type: "Part"
    description: "Flex child column"
  - class: "column-1|2|3|4|6|8|9|12"
    prop: "width=\"1..12\""
    type: "Size"
    description: "Fractional width / 12"
  - class: "column-narrow"
    prop: "narrow"
    type: "Modifier"
    description: "Flex: none (fit content)"
