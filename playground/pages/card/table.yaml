rows:
  - class: "card"
    prop: "<Card>"
    type: "Component"
    description: "Card"
  - class: "card-title"
    prop: "<CardTitle>"
    type: "Part"
    description: "Title part"
  - class: "card-body"
    prop: "<CardBody>"
    type: "Part"
    description: "Body part (content)"
  - class: "card-actions"
    prop: "<CardActions justify=\"...\">"
    type: "Part"
    description: "Actions part (buttons, etc.)"
  - class: "(figure)"
    prop: "<CardFigure>"
    type: "Part"
    description: "Image/figure container"
  - class: "card-border"
    prop: "border"
    type: "Style"
    description: "Adds border to card"
  - class: "card-dash"
    prop: "dash"
    type: "Style"
    description: "Dash style border"
  - class: "card-side"
    prop: "side"
    type: "Modifier"
    description: "The image in the figure will be on the side"
  - class: "image-full"
    prop: "imageFull"
    type: "Modifier"
    description: "The image in the figure will be the background"
  - class: "card-xs"
    prop: "size=\"xs\""
    type: "Size"
    description: "Extra small size"
  - class: "card-sm"
    prop: "size=\"sm\""
    type: "Size"
    description: "Small size"
  - class: "card-md"
    prop: "size=\"md\" (default)"
    type: "Size"
    description: "Medium size"
    default: true
  - class: "card-lg"
    prop: "size=\"lg\""
    type: "Size"
    description: "Large size"
  - class: "card-xl"
    prop: "size=\"xl\""
    type: "Size"
    description: "Extra large size"
