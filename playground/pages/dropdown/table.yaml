rows:
  - class: "dropdown"
    prop: "<Dropdown>"
    type: "Component"
    description: "Container that manages the open state of the menu"
  - class: "dropdown-trigger"
    prop: "<DropdownTrigger>"
    type: "Part"
    description: "Button or element that opens/closes the menu"
  - class: "dropdown-content"
    prop: "<DropdownContent>"
    type: "Part"
    description: "Floating panel positioned relative to the trigger"
  - class: "dropdown-open"
    prop: "open / defaultOpen"
    type: "Modifier"
    description: "Shows the panel (applied automatically by the component)"
  - class: "dropdown-width-xs|sm|md|lg|xl"
    prop: "width=\"md\""
    type: "Size"
    description: "Fixed panel width (12rem..20rem); default auto fits the content"
  - class: "dropdown-placement-bottom-start"
    prop: "placement=\"bottom-start\" (default)"
    type: "Placement"
    description: "Opens below the trigger, aligned to its start edge"
    default: true
  - class: "dropdown-placement-bottom-center"
    prop: "placement=\"bottom-center\""
    type: "Placement"
    description: "Opens below the trigger, horizontally centered"
  - class: "dropdown-placement-bottom-end"
    prop: "placement=\"bottom-end\""
    type: "Placement"
    description: "Opens below the trigger, aligned to its end edge"
  - class: "dropdown-placement-top-start"
    prop: "placement=\"top-start\""
    type: "Placement"
    description: "Opens above the trigger, aligned to its start edge"
  - class: "dropdown-placement-top-center"
    prop: "placement=\"top-center\""
    type: "Placement"
    description: "Opens above the trigger, horizontally centered"
  - class: "dropdown-placement-top-end"
    prop: "placement=\"top-end\""
    type: "Placement"
    description: "Opens above the trigger, aligned to its end edge"
  - class: "dropdown-placement-left-start|left-center|left-end"
    prop: "placement=\"left-*\""
    type: "Placement"
    description: "Opens to the left of the trigger"
  - class: "dropdown-placement-right-start|right-center|right-end"
    prop: "placement=\"right-*\""
    type: "Placement"
    description: "Opens to the right of the trigger"
