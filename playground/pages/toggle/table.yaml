rows:
  - class: "toggle"
    prop: "<Toggle>"
    type: "Component"
    description: "For <input type=\"checkbox\">"
  - class: "toggle-primary"
    prop: "color=\"primary\""
    type: "Color"
    description: "primary color"
  - class: "toggle-secondary"
    prop: "color=\"secondary\""
    type: "Color"
    description: "secondary color"
  - class: "toggle-accent"
    prop: "color=\"accent\""
    type: "Color"
    description: "accent color"
  - class: "toggle-neutral"
    prop: "color=\"neutral\""
    type: "Color"
    description: "neutral color"
  - class: "toggle-success"
    prop: "color=\"success\""
    type: "Color"
    description: "success color"
  - class: "toggle-warning"
    prop: "color=\"warning\""
    type: "Color"
    description: "warning color"
  - class: "toggle-info"
    prop: "color=\"info\""
    type: "Color"
    description: "info color"
  - class: "toggle-error"
    prop: "color=\"error\""
    type: "Color"
    description: "error color"
  - class: "toggle-xs"
    prop: "size=\"xs\""
    type: "Size"
    description: "Extra small size"
  - class: "toggle-sm"
    prop: "size=\"sm\""
    type: "Size"
    description: "Small size"
  - class: "toggle-md"
    prop: "size=\"md\" (default)"
    type: "Size"
    description: "Medium size"
    default: true
  - class: "toggle-lg"
    prop: "size=\"lg\""
    type: "Size"
    description: "Large size"
  - class: "toggle-xl"
    prop: "size=\"xl\""
    type: "Size"
    description: "Extra large size"
