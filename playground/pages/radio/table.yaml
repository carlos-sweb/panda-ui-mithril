rows:
  - class: "radio"
    prop: "<Radio>"
    type: "Component"
    description: "For radio input"
  - class: "radio-neutral"
    prop: "color=\"neutral\""
    type: "Color"
    description: "neutral color"
  - class: "radio-primary"
    prop: "color=\"primary\""
    type: "Color"
    description: "primary color"
  - class: "radio-secondary"
    prop: "color=\"secondary\""
    type: "Color"
    description: "secondary color"
  - class: "radio-accent"
    prop: "color=\"accent\""
    type: "Color"
    description: "accent color"
  - class: "radio-success"
    prop: "color=\"success\""
    type: "Color"
    description: "success color"
  - class: "radio-warning"
    prop: "color=\"warning\""
    type: "Color"
    description: "warning color"
  - class: "radio-info"
    prop: "color=\"info\""
    type: "Color"
    description: "info color"
  - class: "radio-error"
    prop: "color=\"error\""
    type: "Color"
    description: "error color"
  - class: "radio-xs"
    prop: "size=\"xs\""
    type: "Size"
    description: "Extra small size"
  - class: "radio-sm"
    prop: "size=\"sm\""
    type: "Size"
    description: "Small size"
  - class: "radio-md"
    prop: "size=\"md\" (default)"
    type: "Size"
    description: "Medium size"
    default: true
  - class: "radio-lg"
    prop: "size=\"lg\""
    type: "Size"
    description: "Large size"
  - class: "radio-xl"
    prop: "size=\"xl\""
    type: "Size"
    description: "Extra large size"
