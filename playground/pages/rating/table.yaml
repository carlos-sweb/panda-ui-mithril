rows:
  - class: "rating"
    prop: "<Rating value={...} max={...}>"
    type: "Component"
    description: "Rating container (flex row of stars)"
  - class: "rating-star"
    prop: "(internal)"
    type: "Part"
    description: "Each star is a lucide Star icon; filled/empty states via recipe"
  - class: "rating-xs"
    prop: "size=\"xs\""
    type: "Size"
    description: "Extra small size"
  - class: "rating-sm"
    prop: "size=\"sm\""
    type: "Size"
    description: "Small size"
  - class: "rating-md"
    prop: "size=\"md\" (default)"
    type: "Size"
    description: "Medium size"
    default: true
  - class: "rating-lg"
    prop: "size=\"lg\""
    type: "Size"
    description: "Large size"
  - class: "rating-xl"
    prop: "size=\"xl\""
    type: "Size"
    description: "Extra large size"
