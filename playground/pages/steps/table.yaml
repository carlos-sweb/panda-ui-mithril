rows:
  - class: "steps"
    prop: "<Steps>"
    type: "Component"
    description: "Steps container"
  - class: "step"
    prop: "<Step color=\"...\">"
    type: "Component"
    description: "A single step"
  - class: "step-icon"
    prop: "<StepIcon>"
    type: "Part"
    description: "Custom icon instead of the auto-numbered counter"
  - class: "steps-horizontal"
    prop: "(default)"
    type: "Placement"
    description: "Shows steps horizontally"
    default: true
  - class: "steps-vertical"
    prop: "vertical"
    type: "Placement"
    description: "Shows steps vertically"
  - class: "step-neutral"
    prop: "color=\"neutral\""
    type: "Color"
    description: "neutral color"
  - class: "step-primary"
    prop: "color=\"primary\""
    type: "Color"
    description: "primary color"
  - class: "step-secondary"
    prop: "color=\"secondary\""
    type: "Color"
    description: "secondary color"
  - class: "step-accent"
    prop: "color=\"accent\""
    type: "Color"
    description: "accent color"
  - class: "step-info"
    prop: "color=\"info\""
    type: "Color"
    description: "info color"
  - class: "step-success"
    prop: "color=\"success\""
    type: "Color"
    description: "success color"
  - class: "step-warning"
    prop: "color=\"warning\""
    type: "Color"
    description: "warning color"
  - class: "step-error"
    prop: "color=\"error\""
    type: "Color"
    description: "error color"
