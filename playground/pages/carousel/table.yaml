rows:
  - class: "carousel"
    prop: "<Carousel align=\"...\" vertical>"
    type: "Component"
    description: "Carousel container"
  - class: "carousel-item"
    prop: "<CarouselItem>"
    type: "Part"
    description: "A single slide"
  - class: "carousel-start"
    prop: "align=\"start\" (default)"
    type: "Modifier"
    description: "Snap elements to start"
    default: true
  - class: "carousel-center"
    prop: "align=\"center\""
    type: "Modifier"
    description: "Snap elements to center"
  - class: "carousel-end"
    prop: "align=\"end\""
    type: "Modifier"
    description: "Snap elements to end"
  - class: "carousel-horizontal"
    prop: "(default)"
    type: "Placement"
    description: "Horizontal layout"
    default: true
  - class: "carousel-vertical"
    prop: "vertical"
    type: "Placement"
    description: "Vertical layout"
