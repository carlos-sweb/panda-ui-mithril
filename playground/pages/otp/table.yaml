rows:
  - class: "otp"
    prop: "<OTP length={...}>"
    type: "Component"
    description: "For the container label"
  - class: "otp-joined"
    prop: "joined"
    type: "Modifier"
    description: "Connects the character boxes together"
  - class: "otp-xs"
    prop: "size=\"xs\""
    type: "Size"
    description: "Extra small size"
  - class: "otp-sm"
    prop: "size=\"sm\""
    type: "Size"
    description: "Small size"
  - class: "otp-md"
    prop: "size=\"md\" (default)"
    type: "Size"
    description: "Medium size"
    default: true
  - class: "otp-lg"
    prop: "size=\"lg\""
    type: "Size"
    description: "Large size"
  - class: "otp-xl"
    prop: "size=\"xl\""
    type: "Size"
    description: "Extra large size"
  - class: "otp-neutral"
    prop: "color=\"neutral\""
    type: "Color"
    description: "neutral color"
  - class: "otp-primary"
    prop: "color=\"primary\""
    type: "Color"
    description: "primary color"
  - class: "otp-secondary"
    prop: "color=\"secondary\""
    type: "Color"
    description: "secondary color"
  - class: "otp-accent"
    prop: "color=\"accent\""
    type: "Color"
    description: "accent color"
  - class: "otp-success"
    prop: "color=\"success\""
    type: "Color"
    description: "success color"
  - class: "otp-info"
    prop: "color=\"info\""
    type: "Color"
    description: "info color"
  - class: "otp-warning"
    prop: "color=\"warning\""
    type: "Color"
    description: "warning color"
  - class: "otp-error"
    prop: "color=\"error\""
    type: "Color"
    description: "error color"
