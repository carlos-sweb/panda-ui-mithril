rows:
  - class: "otp"
    prop: "<OTP length={...} onchange={...} oncomplete={...}>"
    type: "Component"
    description: "One-time password input — one real input per cell, full code via onchange/oncomplete"
  - class: "otp-input"
    prop: "cell"
    type: "Part"
    description: "Each digit cell — a real <input> with native caret and focus ring"
  - class: "otp-separator"
    prop: "separator=\"-\""
    type: "Part"
    description: "Visual separator between groups of 3 cells"
  - class: "otp-joined"
    prop: "joined"
    type: "Modifier"
    description: "Connects the character cells together (shared borders)"
  - prop: "mask"
    type: "Modifier"
    description: "Hides the code (true → '•' or a custom char); the real value flows via onchange"
  - prop: "error"
    type: "Modifier"
    description: "Applies error styles + aria-invalid to all cells"
  - prop: "oneTimeCode"
    type: "Modifier"
    description: "Sets autocomplete=\"one-time-code\" on the first cell (SMS autofill)"
  - prop: "type=\"numeric\" (default)"
    type: "Behavior"
    description: "Digits only — invalid characters are discarded"
  - prop: "type=\"alphanumeric\""
    type: "Behavior"
    description: "Letters + digits"
  - prop: "pattern={/^[0-3]$/}"
    type: "Behavior"
    description: "Custom per-character RegExp validation (overrides type)"
  - prop: "onchange"
    type: "Behavior"
    description: "Fired on every change with the full code"
  - prop: "oncomplete"
    type: "Behavior"
    description: "Fired when all cells are filled"
  - prop: "autoFocus"
    type: "Behavior"
    description: "Focuses the first cell on mount"
  - class: "otp-xs"
    prop: "size=\"xs\""
    type: "Size"
    description: "Extra small cells"
  - class: "otp-sm"
    prop: "size=\"sm\""
    type: "Size"
    description: "Small cells"
  - class: "otp-md"
    prop: "size=\"md\" (default)"
    type: "Size"
    description: "Medium cells"
    default: true
  - class: "otp-lg"
    prop: "size=\"lg\""
    type: "Size"
    description: "Large cells"
  - class: "otp-xl"
    prop: "size=\"xl\""
    type: "Size"
    description: "Extra large cells"
  - class: "otp-primary"
    prop: "color=\"primary\" (default)"
    type: "Color"
    description: "primary focus accent"
    default: true
  - class: "otp-neutral"
    prop: "color=\"neutral\""
    type: "Color"
    description: "neutral focus accent"
  - class: "otp-secondary"
    prop: "color=\"secondary\""
    type: "Color"
    description: "secondary focus accent"
  - class: "otp-accent"
    prop: "color=\"accent\""
    type: "Color"
    description: "accent focus accent"
  - class: "otp-success"
    prop: "color=\"success\""
    type: "Color"
    description: "success focus accent"
  - class: "otp-info"
    prop: "color=\"info\""
    type: "Color"
    description: "info focus accent"
  - class: "otp-warning"
    prop: "color=\"warning\""
    type: "Color"
    description: "warning focus accent"
  - class: "otp-error"
    prop: "color=\"error\""
    type: "Color"
    description: "error focus accent"
