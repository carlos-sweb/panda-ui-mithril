rows:
  - class: "tooltip"
    prop: "<Tooltip tip=\"...\">"
    type: "Component"
    description: "Container element"
  - class: "tooltip-content"
    type: "Part"
    description: "Optional. Setting a div as the content of the tooltip instead of the `data-tip` text — not supported by this component, only the `tip` attribute is"
  - class: "tooltip-top"
    prop: "position=\"top\" (default)"
    type: "Placement"
    description: "Put tooltip on top"
    default: true
  - class: "tooltip-bottom"
    prop: "position=\"bottom\""
    type: "Placement"
    description: "Put tooltip on bottom"
  - class: "tooltip-left"
    prop: "position=\"left\""
    type: "Placement"
    description: "Put tooltip on left"
  - class: "tooltip-right"
    prop: "position=\"right\""
    type: "Placement"
    description: "Put tooltip on right"
  - class: "tooltip-start"
    type: "Placement"
    description: "Align tooltip on start — not supported by this component"
  - class: "tooltip-center"
    type: "Placement"
    description: "Align tooltip on center — not supported by this component"
  - class: "tooltip-end"
    type: "Placement"
    description: "Align tooltip on end — not supported by this component"
  - class: "tooltip-open"
    prop: "open"
    type: "Modifier"
    description: "Force open tooltip"
  - class: "tooltip-neutral"
    prop: "color=\"neutral\" (default)"
    type: "Color"
    description: "neutral color"
    default: true
  - class: "tooltip-primary"
    prop: "color=\"primary\""
    type: "Color"
    description: "primary color"
  - class: "tooltip-secondary"
    prop: "color=\"secondary\""
    type: "Color"
    description: "secondary color"
  - class: "tooltip-accent"
    prop: "color=\"accent\""
    type: "Color"
    description: "accent color"
  - class: "tooltip-info"
    prop: "color=\"info\""
    type: "Color"
    description: "info color"
  - class: "tooltip-success"
    prop: "color=\"success\""
    type: "Color"
    description: "success color"
  - class: "tooltip-warning"
    prop: "color=\"warning\""
    type: "Color"
    description: "warning color"
  - class: "tooltip-error"
    prop: "color=\"error\""
    type: "Color"
    description: "error color"
