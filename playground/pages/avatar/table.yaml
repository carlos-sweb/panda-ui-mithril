rows:
  - class: "avatar"
    prop: "<Avatar src={...}>"
    type: "Component"
    description: "Avatar"
  - class: "avatar-group"
    prop: "<AvatarGroup>"
    type: "Component"
    description: "Container for multiple avatars"
  - class: "avatar-online"
    prop: "status=\"online\""
    type: "Modifier"
    description: "shows a green dot as online indicator"
  - class: "avatar-offline"
    prop: "status=\"offline\""
    type: "Modifier"
    description: "shows a gray dot as offline indicator"
  - class: "avatar-placeholder"
    prop: "placeholder"
    type: "Modifier"
    description: "To show letters/initials as avatar placeholder"
  - class: "w-* rounded-full"
    prop: "shape=\"circle\" (default)"
    type: "Style"
    description: "Circular avatar"
    default: true
  - class: "w-* rounded"
    prop: "shape=\"square\""
    type: "Style"
    description: "Rounded-square avatar"
