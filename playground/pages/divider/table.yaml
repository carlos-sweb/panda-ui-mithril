rows:
  - class: "divider"
    prop: "<Divider>"
    type: "Component"
    description: "A divider line between two elements"
  - class: "divider-neutral"
    prop: "color=\"neutral\""
    type: "Color"
    description: "neutral color"
  - class: "divider-primary"
    prop: "color=\"primary\""
    type: "Color"
    description: "primary color"
  - class: "divider-secondary"
    prop: "color=\"secondary\""
    type: "Color"
    description: "secondary color"
  - class: "divider-accent"
    prop: "color=\"accent\""
    type: "Color"
    description: "accent color"
  - class: "divider-success"
    prop: "color=\"success\""
    type: "Color"
    description: "success color"
  - class: "divider-warning"
    prop: "color=\"warning\""
    type: "Color"
    description: "warning color"
  - class: "divider-info"
    prop: "color=\"info\""
    type: "Color"
    description: "info color"
  - class: "divider-error"
    prop: "color=\"error\""
    type: "Color"
    description: "error color"
  - class: "divider-vertical"
    prop: "direction=\"horizontal\" (default)"
    type: "Direction"
    description: "Divide vertical elements (on top of each other) — this is the default, no prop needed"
    default: true
  - class: "divider-horizontal"
    prop: "direction=\"vertical\""
    type: "Direction"
    description: "Divide horizontal elements (next to each other) — note: this component's direction prop names the opposite of its class name"
  - class: "divider-start"
    prop: "placement=\"start\""
    type: "Placement"
    description: "Pushes the divider text to the start"
  - class: "divider-end"
    prop: "placement=\"end\""
    type: "Placement"
    description: "Pushes the divider text to the end"
