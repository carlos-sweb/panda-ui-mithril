rows:
  - class: "tabs"
    prop: "<Tabs boxed|bordered|lifted>"
    type: "Component"
    description: "Tabs container"
  - class: "tabs-tab"
    prop: "<Tab ref=\"...\">"
    type: "Component"
    description: "A single tab — linked to TabContent via ref"
  - class: "tabs-content"
    prop: "<TabContent ref=\"...\">"
    type: "Part"
    description: "Panel shown for the active tab"
  - class: "tab-active"
    prop: "auto-applied"
    type: "State"
    description: "Applied to active tab automatically"
  - class: "tab-disabled"
    prop: "<Tab disabled>"
    type: "Modifier"
    description: "Disables a tab"
  - class: "tabs-box"
    prop: "boxed"
    type: "Style"
    description: "Tabs styled as a pill-shaped button group"
  - class: "tabs-border"
    prop: "bordered"
    type: "Style"
    description: "Tabs with a bottom border indicator"
  - class: "tabs-lift"
    prop: "lifted"
    type: "Style"
    description: "Tabs that visually connect to their content panel below"
  - class: "tabs-xs"
    prop: "size=\"xs\""
    type: "Size"
    description: "Extra small size"
  - class: "tabs-sm"
    prop: "size=\"sm\""
    type: "Size"
    description: "Small size"
  - class: "tabs-md"
    prop: "size=\"md\" (default)"
    type: "Size"
    description: "Medium size"
    default: true
  - class: "tabs-lg"
    prop: "size=\"lg\""
    type: "Size"
    description: "Large size"
  - class: "tabs-xl"
    prop: "size=\"xl\""
    type: "Size"
    description: "Extra large size"
