rows:
  - class: "megamenu"
    prop: "<Megamenu>"
    type: "Component"
    description: "Nav container"
  - class: "(item wrapper)"
    prop: "<MegamenuItem>"
    type: "Part"
    description: "Positions a trigger + its dropdown panel together"
  - class: "[popovertarget]"
    prop: "<MegamenuTrigger href? chevron?>"
    type: "Part"
    description: "The clickable/hoverable trigger — renders a link if `href` is given"
  - class: "[popover]"
    prop: "<MegamenuPanel>"
    type: "Part"
    description: "The dropdown panel, shown on hover/focus of its MegamenuItem"
  - class: "megamenu-active"
    prop: "<MegamenuActive />"
    type: "Modifier"
    description: "Manual highlight overlay — the reference implementation animates this between triggers via CSS anchor positioning, not supported here"
  - class: "megamenu-xs"
    prop: "size=\"xs\""
    type: "Size"
    description: "Extra small size"
  - class: "megamenu-sm"
    prop: "size=\"sm\""
    type: "Size"
    description: "Small size"
  - class: "megamenu-md"
    prop: "size=\"md\" (default)"
    type: "Size"
    description: "Medium size"
    default: true
  - class: "megamenu-lg"
    prop: "size=\"lg\""
    type: "Size"
    description: "Large size"
  - class: "megamenu-xl"
    prop: "size=\"xl\""
    type: "Size"
    description: "Extra large size"
