rows:
  - class: "range"
    prop: "<Range value={...} max={...}>"
    type: "Component"
    description: "For <input type=\"range\"> tag"
  - class: "range-neutral"
    prop: "color=\"neutral\""
    type: "Color"
    description: "neutral color"
  - class: "range-primary"
    prop: "color=\"primary\""
    type: "Color"
    description: "primary color"
  - class: "range-secondary"
    prop: "color=\"secondary\""
    type: "Color"
    description: "secondary color"
  - class: "range-accent"
    prop: "color=\"accent\""
    type: "Color"
    description: "accent color"
  - class: "range-success"
    prop: "color=\"success\""
    type: "Color"
    description: "success color"
  - class: "range-warning"
    prop: "color=\"warning\""
    type: "Color"
    description: "warning color"
  - class: "range-info"
    prop: "color=\"info\""
    type: "Color"
    description: "info color"
  - class: "range-error"
    prop: "color=\"error\""
    type: "Color"
    description: "error color"
  - class: "range-xs"
    prop: "size=\"xs\""
    type: "Size"
    description: "Extra small size"
  - class: "range-sm"
    prop: "size=\"sm\""
    type: "Size"
    description: "Small size"
  - class: "range-md"
    prop: "size=\"md\" (default)"
    type: "Size"
    description: "Medium size"
    default: true
  - class: "range-lg"
    prop: "size=\"lg\""
    type: "Size"
    description: "Large size"
  - class: "range-xl"
    prop: "size=\"xl\""
    type: "Size"
    description: "Extra large size"
  - class: "range-vertical"
    prop: "vertical"
    type: "Direction"
    description: "Vertical slider"
