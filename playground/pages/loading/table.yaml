rows:
  - class: "loading"
    prop: "<Loading variant=\"...\">"
    type: "Component"
    description: "Loading element"
  - class: "loading-spinner"
    prop: "variant=\"spinner\""
    type: "Style"
    description: "spinner animation"
  - class: "loading-dots"
    prop: "variant=\"dots\""
    type: "Style"
    description: "dots animation"
  - class: "loading-ring"
    prop: "variant=\"ring\""
    type: "Style"
    description: "ring animation"
  - class: "loading-ball"
    prop: "variant=\"ball\""
    type: "Style"
    description: "ball animation"
  - class: "loading-bars"
    prop: "variant=\"bars\""
    type: "Style"
    description: "bars animation"
  - class: "loading-infinity"
    prop: "variant=\"infinity\""
    type: "Style"
    description: "infinity animation"
  - class: "loading-xs"
    prop: "size=\"xs\""
    type: "Size"
    description: "extra small size"
  - class: "loading-sm"
    prop: "size=\"sm\""
    type: "Size"
    description: "small size"
  - class: "loading-md"
    prop: "size=\"md\" (default)"
    type: "Size"
    description: "medium size"
    default: true
  - class: "loading-lg"
    prop: "size=\"lg\""
    type: "Size"
    description: "large size"
  - class: "loading-xl"
    prop: "size=\"xl\""
    type: "Size"
    description: "extra large size"
