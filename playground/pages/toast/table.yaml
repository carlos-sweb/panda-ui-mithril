rows:
  - class: "toast"
    prop: "<Toast position=\"...\">"
    type: "Component"
    description: "Container element, fixed to the viewport"
  - class: "toast-start"
    prop: "position=\"... start\""
    type: "Placement"
    description: "Aligns to the start (left in LTR)"
  - class: "toast-center"
    prop: "position=\"... center\""
    type: "Placement"
    description: "Aligns to the horizontal center"
  - class: "toast-end"
    prop: "position=\"... end\" (default)"
    type: "Placement"
    description: "Aligns to the end (right in LTR)"
    default: true
  - class: "toast-top"
    prop: "position=\"top ...\""
    type: "Placement"
    description: "Aligns to the top"
  - class: "toast-middle"
    prop: "position=\"middle ...\""
    type: "Placement"
    description: "Aligns to the vertical middle"
  - class: "toast-bottom"
    prop: "position=\"bottom ...\" (default)"
    type: "Placement"
    description: "Aligns to the bottom"
    default: true
