rows:
  - class: "list"
    prop: "<List>"
    type: "Component"
    description: "A vertical flex layout to include list rows"
  - class: "list-row"
    prop: "<ListRow>"
    type: "Component"
    description: "The item inside list. A horizontal grid layout to include data"
  - class: "list-col-wrap"
    prop: "<ListCol wrap>"
    type: "Modifier"
    description: "For one of the direct children of list-row to push it to the next line"
  - class: "list-col-grow"
    prop: "<ListCol grow>"
    type: "Modifier"
    description: "For one of the direct children of list-row to make it fill the remaining space (2nd child grows by default)"
  - class: "—"
    prop: "data={items}"
    type: "Prop"
    description: "Array of items. When passed, the row template repeats per item (data-driven mode). Without it, explicit children (ListRow/ListCol) are used."
  - class: "—"
    prop: "render={(item, index) => ...}"
    type: "Prop"
    description: "Row template repeated data.length times. Required when `data` is passed (alternative: a single function child)."
  - class: "—"
    prop: "key={(item, index) => ...}"
    type: "Prop"
    description: "Key accessor for Mithril diffing when resizing/reordering. Default: index."
  - class: "—"
    prop: "header={vnode}"
    type: "Prop"
    description: "Static row at the top of the list (data-driven mode only)."
  - class: "—"
    prop: "footer={vnode}"
    type: "Prop"
    description: "Static row at the bottom of the list (data-driven mode only)."
  - class: "—"
    prop: "empty={vnode}"
    type: "Prop"
    description: "Content shown when `data` is empty."
  - class: "—"
    prop: "loading={true}"
    type: "Prop"
    description: "Shows `loadingRows` Skeleton rows instead of the data while loading."
  - class: "—"
    prop: "loadingRows={3}"
    type: "Prop"
    description: "Number of Skeleton rows when `loading`. Default: 3."
  - class: "—"
    prop: "hover"
    type: "Prop"
    description: "Applies the hover highlight to all ListRow rows in data-driven mode."
  - class: "—"
    prop: "ordered"
    type: "Prop"
    description: "Renders an <ol> instead of <ul>."
  - class: "—"
    prop: "sortable"
    type: "Prop"
    description: "Enables drag-to-reorder of the data-driven rows (sortable-self). The drag engine wraps SortableJS internally; the whole row is draggable by default, or only the ListDragHandle grip when the row template includes one."
  - class: "—"
    prop: "onReorder={(next) => ...}"
    type: "Prop"
    description: "Controlled callback receiving the new order when a row is dropped: update `data` from `next`. List never mutates the array."
  - class: "list-drag-handle"
    prop: "<ListDragHandle>"
    type: "Component"
    description: "Grip column inside a row (GripVertical icon). With `sortable`, drag starts only from it; without `sortable` it stays as a static grip."
