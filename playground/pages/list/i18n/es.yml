paragraph: List es un diseño vertical para mostrar información en filas.
buenUsoTitle: Buen uso — inbox estilo Gmail / Proton Mail
buenUsoDesc: >-
  Patrón de fila inspirado en Gmail/Proton Mail: una <strong>estrella</strong>
  como acción, un <code>Avatar</code> con la <strong>inicial y un color por
  remitente</strong>, el <strong>remitente con el asunto debajo</strong> y la
  <strong>hora a la derecha</strong>. Todo compone componentes de la librería
  (<code>Avatar</code>, <code>Button</code>, <code>ListCol</code>) dentro del
  <code>render</code> data-driven — eventos, layout y estados por fila sin
  salirse del componente.
dataFnTitle: Data-driven (children como función)
dataFnDesc: >-
  <code>data</code> + children como función: el template se repite por item.
  Añade/elimina filas para ver el redimensionado (keys por <code>id</code>).
dataRenderTitle: Data-driven (render prop)
dataRenderDesc: >-
  <code>data</code> + <code>render</code> con <code>header</code>,
  <code>footer</code>, <code>hover</code> (a nivel de List), <code>loading</code>
  (filas Skeleton) y <code>empty</code>.
dataUsageTitle: Uso data-driven
interactiveTitle: Interactivo — agregar / quitar items
interactiveDesc: >-
  Mantén el array en <code>vnode.state</code> y mutalo desde los handlers
  (<code>push</code> para agregar, <code>splice</code> para quitar) — Mithril
  redibuja automáticamente tras cada evento y el <code>key</code> por
  <code>id</code> mantiene el diffing correcto. Es el mismo patrón que usan
  los demos de arriba.
sortableTitle: Sortable (self) — arrastra las filas para reordenar
sortableDesc: >-
  El drag-to-reorder de las filas data-driven no se implementa desde cero:
  <code>List</code> envuelve <strong>SortableJS</strong>
  (<a href="https://sortablejs.github.io/Sortable/" target="_blank" rel="noreferrer">sortablejs.github.io/Sortable</a>),
  así que todo el motor de arrastre viene de la librería y tú mantienes una API
  controlada: <code>sortable</code> lo habilita y <code>onReorder(next)</code>
  recibe el nuevo orden al soltar una fila (List nunca muta <code>data</code>).
  Caso de uso del demo: ordenar un pipeline postcss — el orden visual es
  exactamente el orden que llega en <code>next</code>. Por defecto se arrastra
  la fila entera; incluye un <code>ListDragHandle</code> en el template de la
  fila para arrastrar solo desde el asa (recomendado cuando la fila tiene
  botones/inputs). Prueba el <code>✕</code>: un click no inicia arrastre, y la
  columna <code>index</code> demuestra que el modelo sí se reordenó.
sortableWholeLabel: Arrastre de fila entera (sin asa)
sortableHandleLabel: Arrastre solo desde el asa ListDragHandle
