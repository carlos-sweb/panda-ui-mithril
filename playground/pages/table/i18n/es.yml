paragraph: "Tabla con modo compositivo y data-driven: columnas, paginación automática y ordenamiento (numérico de mayor a menor / texto A-Z)."
zebraTitle: "Zebra + filas con hover"
borderedTitle: "Bordeado"
borderedDesc: "bordered agrega la rejilla completa: borde exterior + divisores verticales entre columnas. Funciona en ambos modos (compositivo y data-driven)."
dataTitle: "Data-driven — paginación automática"
dataDesc: "40 filas con pageSize 5 → se muestran 5 por página y la Pagination aparece sola (con 3 filas no aparecería). Click en los encabezados para ordenar: texto A-Z/Z-A, sueldo de mayor a menor / menor a mayor."
sortingTitle: "Ordenado"
sortingDesc: "Ciclo por click: asc → desc → sin orden. La detección de tipo es automática (numérico vs texto); sortType la fuerza y sort permite un comparador custom."
controlledTitle: "Controlado — page + sort"
controlledDesc: "page/onchange y sort/onSortChange siguen el contrato controlado de la librería: el estado vive fuera."
columnsTitle: "Columnas — align, width, render"
columnsDesc: "alineación y ancho por columna; render para celdas custom (acciones, formato)."
statesTitle: "Estados vacio y cargando"
statesDesc: "vacio (fila con colSpan) y cargando (filas Skeleton keyed)."
i18nTitle: "i18n — español / inglés"
i18nDesc: "setLocale('es' | 'en') cambia los strings internos de la librería (estado vacío por defecto, aria-label de la paginación) y la elección se persiste en localStorage (pum-lang). Este demo muestra el estado vacío por defecto (sin prop empty)."
paginationPropsTitle: "Props del Pagination interno"
paginationPropsDesc: "pagination={{ ... }} pasa props al Pagination interno (variant, shape, size, siblings, boundaries, ...); pagination={false} desactiva la paginación (muestra todas las filas)."
rowsPerPageTitle: "Filas por página"
rowsPerPageDesc: "pageSizeOptions muestra un selector de filas por página; la etiqueta es i18n (Rows per page / Filas por página) o se puede sobrescribir con perPageLabel."
