paragraph: "Table with compositive and data-driven modes: columns, automatic pagination and sorting (numeric mayor a menor / text A-Z)."
zebraTitle: "Zebra + hoverable rows"
borderedTitle: "Bordered"
borderedDesc: "bordered adds the full grid: outer border + vertical dividers between columns. Works in both modes (compositive and data-driven)."
dataTitle: "Data-driven — automatic pagination"
dataDesc: "40 rows with pageSize 5 → 5 per page and the Pagination appears automatically (with 3 rows it would not). Click the headers to sort: text A-Z/Z-A, salary highest to lowest / lowest to highest."
sortingTitle: "Sorting"
sortingDesc: "Click cycle: asc → desc → no sort. Type detection is automatic (numeric vs text); sortType forces it and sort allows a custom comparator."
controlledTitle: "Controlled — page + sort"
controlledDesc: "page/onchange and sort/onSortChange follow the library's controlled contract: the state lives outside."
columnsTitle: "Columns — align, width, render"
columnsDesc: "align and width per column; render for custom cells (actions, formatting)."
statesTitle: "States — empty and loading"
statesDesc: "empty (colSpan row) and loading (keyed Skeleton rows)."
paginationPropsTitle: "Internal Pagination props"
paginationPropsDesc: "pagination={{ ... }} passes props to the internal Pagination (variant, shape, size, siblings, boundaries, ...); pagination={false} disables pagination (shows all rows)."
rowsPerPageTitle: "Rows per page"
rowsPerPageDesc: "pageSizeOptions shows a per-page selector; the label is i18n (Rows per page / Filas por página) or overridable with perPageLabel."
stickyHeaderTitle: "Sticky header"
stickyHeaderDesc: "stickyHeader pins the thead while the body scrolls — pair it with maxHeight (TableContainer in compositive mode, Table in data-driven mode) to create the scroll region."
