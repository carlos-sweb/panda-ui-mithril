rows:
  - class: "table"
    prop: "<Table>"
    type: "Component"
    description: "Table element"
  - class: "(wrapper)"
    prop: "<TableContainer>"
    type: "Part"
    description: "Optional wrapper with horizontal scroll, useful for small screens"
  - class: "table-zebra"
    prop: "zebra"
    type: "Modifier"
    description: "Adds zebra-stripe to even rows"
  - class: "table-pin-rows"
    prop: "pinRows"
    type: "Modifier"
    description: "Makes thead and tfoot rows sticky"
  - class: "table-pin-cols"
    prop: "pinCols"
    type: "Modifier"
    description: "Makes the first column of each row sticky"
  - class: "row-hover"
    prop: "<TableRow hover>"
    type: "Modifier"
    description: "Highlights a row on hover"
  - class: "table-xs"
    prop: "size=\"xs\""
    type: "Size"
    description: "Extra small size"
  - class: "table-sm"
    prop: "size=\"sm\""
    type: "Size"
    description: "Small size"
  - class: "table-md"
    prop: "size=\"md\" (default)"
    type: "Size"
    description: "Medium size"
    default: true
  - class: "table-lg"
    prop: "size=\"lg\""
    type: "Size"
    description: "Large size"
  - class: "table-xl"
    prop: "size=\"xl\""
    type: "Size"
    description: "Extra large size"
