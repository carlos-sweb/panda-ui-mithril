rows:
  - class: "table"
    prop: "<Table>"
    type: "Component"
    description: "Table element (compositive mode or data-driven with `data`)"
  - class: "(wrapper)"
    prop: "<TableContainer maxHeight>"
    type: "Behavior"
    description: "Max height — vertical scroll region (pairs with stickyHeader)"
  - class: "table-sticky-header"
    prop: "stickyHeader"
    type: "Behavior"
    description: "Pins the thead while the body scrolls (pair with maxHeight)"
  - class: "(wrapper)"
    prop: "<TableContainer>"
    type: "Part"
    description: "Optional wrapper with horizontal scroll, useful for small screens"
  - class: "table-data"
    prop: "data"
    type: "Behavior"
    description: "Data-driven mode: renders columns and paginates automatically"
  - class: "table-data"
    prop: "columns"
    type: "Behavior"
    description: "Column config: key, title, align, width, header, render, sortable, sortType, sort"
  - class: "table-data"
    prop: "pageSizeOptions / perPageLabel / onPageSizeChange"
    type: "Behavior"
    description: "Rows-per-page selector (i18n label, perPageLabel overrides); page resets to 1 on change"
  - class: "table-data"
    prop: "pageSize"
    type: "Behavior"
    description: "Rows per page (default 10); Pagination appears automatically when data exceeds it"
  - class: "table-data"
    prop: "page / defaultPage / onchange"
    type: "Behavior"
    description: "Controlled / uncontrolled pagination (Pagination contract)"
  - class: "table-data"
    prop: "pagination"
    type: "Behavior"
    description: "false disables pagination; object passes props to the internal Pagination"
  - class: "table-data"
    prop: "empty"
    type: "Behavior"
    description: "Empty state content (row with colSpan)"
  - class: "table-data"
    prop: "loading / loadingRows"
    type: "Behavior"
    description: "Skeleton rows while loading"
  - class: "table-data"
    prop: "sort / defaultSort / onSortChange"
    type: "Behavior"
    description: "Controlled / uncontrolled sorting (sortable columns, asc → desc → none)"
  - class: "table-data"
    prop: "sortable (column)"
    type: "Behavior"
    description: "Sortable header; auto-detects numeric (mayor a menor) vs text (A-Z); sortType/sort override"
  - class: "table-bordered"
    prop: "bordered"
    type: "Modifier"
    description: "Full grid: outer border + vertical dividers between columns"
  - class: "table-zebra"
    prop: "zebra"
    type: "Modifier"
    description: "Adds zebra-stripe to even rows"
  - class: "table-pin-rows"
    prop: "pinRows"
    type: "Modifier"
    description: "Makes thead and tfoot rows sticky"
  - class: "table-pin-cols"
    prop: "pinCols"
    type: "Modifier"
    description: "Makes the first column of each row sticky"
  - class: "row-hover"
    prop: "<TableRow hover>"
    type: "Modifier"
    description: "Highlights a row on hover"
  - class: "table-xs"
    prop: "size=\"xs\""
    type: "Size"
    description: "Extra small size"
  - class: "table-sm"
    prop: "size=\"sm\""
    type: "Size"
    description: "Small size"
  - class: "table-md"
    prop: "size=\"md\" (default)"
    type: "Size"
    description: "Medium size"
    default: true
  - class: "table-lg"
    prop: "size=\"lg\""
    type: "Size"
    description: "Large size"
  - class: "table-xl"
    prop: "size=\"xl\""
    type: "Size"
    description: "Extra large size"
