rows:
  - class: "file-input"
    prop: "<FileInput>"
    type: "Component"
    description: "For <input type=\"file\"> element"
  - class: "file-input-ghost"
    prop: "ghost"
    type: "Style"
    description: "ghost style"
  - class: "file-input-neutral"
    prop: "color=\"neutral\""
    type: "Color"
    description: "neutral color"
  - class: "file-input-primary"
    prop: "color=\"primary\""
    type: "Color"
    description: "primary color"
  - class: "file-input-secondary"
    prop: "color=\"secondary\""
    type: "Color"
    description: "secondary color"
  - class: "file-input-accent"
    prop: "color=\"accent\""
    type: "Color"
    description: "accent color"
  - class: "file-input-info"
    prop: "color=\"info\""
    type: "Color"
    description: "info color"
  - class: "file-input-success"
    prop: "color=\"success\""
    type: "Color"
    description: "success color"
  - class: "file-input-warning"
    prop: "color=\"warning\""
    type: "Color"
    description: "warning color"
  - class: "file-input-error"
    prop: "color=\"error\""
    type: "Color"
    description: "error color"
  - class: "file-input-xs"
    prop: "size=\"xs\""
    type: "Size"
    description: "Extra small size"
  - class: "file-input-sm"
    prop: "size=\"sm\""
    type: "Size"
    description: "Small size"
  - class: "file-input-md"
    prop: "size=\"md\" (default)"
    type: "Size"
    description: "Medium size"
    default: true
  - class: "file-input-lg"
    prop: "size=\"lg\""
    type: "Size"
    description: "Large size"
  - class: "file-input-xl"
    prop: "size=\"xl\""
    type: "Size"
    description: "Extra large size"
