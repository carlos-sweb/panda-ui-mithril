rows:
  - class: "colorpicker"
    prop: "<ColorPicker>"
    type: "Component"
    description: "Color picker"
  - class: "colorpicker-md"
    prop: "size=\"md\" (default)"
    type: "Size"
    description: "Medium width"
    default: true
  - class: "colorpicker-xs"
    prop: "size=\"xs\""
    type: "Size"
    description: "Extra small width"
  - class: "colorpicker-sm"
    prop: "size=\"sm\""
    type: "Size"
    description: "Small width"
  - class: "colorpicker-lg"
    prop: "size=\"lg\""
    type: "Size"
    description: "Large width"
  - class: "colorpicker-xl"
    prop: "size=\"xl\""
    type: "Size"
    description: "Extra large width"
  - class: "-"
    prop: "value"
    type: "Prop"
    description: "Controlled hex color (#rrggbb)"
  - class: "-"
    prop: "defaultValue"
    type: "Prop"
    description: "Initial hex color (uncontrolled)"
  - class: "-"
    prop: "onchange"
    type: "Prop"
    description: "Fired with the normalized hex on every change"
  - class: "-"
    prop: "copy"
    type: "Prop"
    description: "Show the copy button in the footer (default true)"
  - class: "-"
    prop: "modes"
    type: "Prop"
    description: "Whitelist of color spaces shown in the menu (default: all)"
  - class: "-"
    prop: "excludeModes"
    type: "Prop"
    description: "Hide specific color spaces from the menu (default: none)"
  - class: "-"
    prop: "trigger"
    type: "Prop"
    description: "Launch as a dropdown from a button/text (string, Vnode or (hex)=>node)"
  - class: "-"
    prop: "close"
    type: "Prop"
    description: "In dropdown mode, ButtonClose at top corner: 'end' (default), 'start', or false"
