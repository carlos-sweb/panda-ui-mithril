rows:
  - class: "aura"
    prop: "<Aura>"
    type: "Component"
    description: "Container that adds a light effect aura around an element. By default it's a rotating border"
  - class: "aura-dual"
    prop: "variant=\"dual\""
    type: "Style"
    description: "Uses two light effects"
  - class: "aura-rainbow"
    prop: "variant=\"rainbow\""
    type: "Style"
    description: "Uses rainbow colors for the light effect"
  - class: "aura-holo"
    prop: "variant=\"holo\""
    type: "Style"
    description: "Uses holographic colors for the light effect"
  - class: "aura-gold"
    prop: "variant=\"gold\""
    type: "Style"
    description: "Uses gold colors for the light effect"
  - class: "aura-silver"
    prop: "variant=\"silver\""
    type: "Style"
    description: "Uses silver colors for the light effect"
  - class: "aura-glow"
    prop: "variant=\"glow\""
    type: "Style"
    description: "Uses a glowing effect instead of a rotating border"
  - class: "(corner radius)"
    prop: "shape=\"box\" | \"field\" | \"selector\""
    type: "Modifier"
    description: "Matches the aura's corner radius to what it wraps (card/alert, button/input, checkbox/toggle/badge)"
  - class: "aura-xs"
    prop: "size=\"xs\""
    type: "Size"
    description: "Extra small size"
  - class: "aura-sm"
    prop: "size=\"sm\""
    type: "Size"
    description: "Small size"
  - class: "aura-md"
    prop: "size=\"md\" (default)"
    type: "Size"
    description: "Medium size"
    default: true
  - class: "aura-lg"
    prop: "size=\"lg\""
    type: "Size"
    description: "Large size"
  - class: "aura-xl"
    prop: "size=\"xl\""
    type: "Size"
    description: "Extra large size"
