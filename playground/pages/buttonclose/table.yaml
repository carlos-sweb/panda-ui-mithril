rows:
  - class: "btn-close"
    prop: "<ButtonClose>"
    type: "Component"
    description: "Circular button with X icon — children are ignored"
  - class: "btn-xs"
    prop: "size=\"xs\""
    type: "Size"
    description: "Extra small size"
  - class: "btn-sm"
    prop: "size=\"sm\""
    type: "Size"
    description: "Small size"
  - class: "btn-md"
    prop: "size=\"md\" (default)"
    type: "Size"
    description: "Medium size"
    default: true
  - class: "btn-lg"
    prop: "size=\"lg\""
    type: "Size"
    description: "Large size"
  - class: "btn-xl"
    prop: "size=\"xl\""
    type: "Size"
    description: "Extra large size"
  - class: "btn-circle"
    prop: "shape=\"circle\" (default)"
    type: "Shape"
    description: "Circle shape"
    default: true
  - class: "btn-square"
    prop: "shape=\"square\""
    type: "Shape"
    description: "Square shape"
  - class: "close-button"
    prop: "strokeWidth={3} (default)"
    type: "number"
    description: "X icon stroke width (lucide prop). Default 3."
