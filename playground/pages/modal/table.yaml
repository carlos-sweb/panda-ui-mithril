rows:
  - class: "modal"
    prop: "<Modal open onclose={...}>"
    type: "Component"
    description: "Native <dialog>-backed modal — `open` drives real .showModal()/.close()"
  - class: "modal-box"
    prop: "<ModalBox>"
    type: "Part"
    description: "The modal content box"
  - class: "modal-action"
    prop: "<ModalAction>"
    type: "Part"
    description: "Container for actions, right-aligned"
  - class: "modal-backdrop"
    prop: "<ModalBackdrop onclick={...}>"
    type: "Part"
    description: "Invisible button behind modal-box — click to close"
  - class: "modal-xs"
    prop: "size=\"xs\""
    type: "Size"
    description: "Panel max-width: 20rem (320px)"
  - class: "modal-sm"
    prop: "size=\"sm\""
    type: "Size"
    description: "Panel max-width: 24rem (384px)"
  - class: "modal-md"
    prop: "size=\"md\" (default)"
    type: "Size"
    description: "Panel max-width: 32rem (512px)"
    default: true
  - class: "modal-lg"
    prop: "size=\"lg\""
    type: "Size"
    description: "Panel max-width: 48rem (768px)"
  - class: "modal-top"
    prop: "position=\"top\""
    type: "Placement"
    description: "Modal box slides in from the top edge (slide-in-down)"
  - class: "modal-middle"
    prop: "position=\"middle\" (default)"
    type: "Placement"
    description: "Modal box centered — fade-in + scale entrance"
    default: true
  - class: "modal-bottom"
    prop: "position=\"bottom\""
    type: "Placement"
    description: "Modal box slides in from the bottom edge (slide-in-up)"
  - class: "modal-start"
    prop: "position=\"start\""
    type: "Placement"
    description: "Modal box slides in from the start/left edge (slide-in-left)"
  - class: "modal-end"
    prop: "position=\"end\""
    type: "Placement"
    description: "Modal box slides in from the end/right edge (slide-in-right)"
  - prop: "buttonClose"
    type: "Modifier"
    description: "Auto-append ButtonClose in ModalAction (form method=\"dialog\")"
