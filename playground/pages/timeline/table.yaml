rows:
  - class: "timeline"
    prop: "<Timeline>"
    type: "Component"
    description: "Timeline container"
  - class: "timeline-start"
    prop: "<TimelineStart>"
    type: "Part"
    description: "The content inside <li> at the start direction"
  - class: "timeline-middle"
    prop: "<TimelineMiddle>"
    type: "Part"
    description: "The content inside <li> at the middle"
  - class: "timeline-end"
    prop: "<TimelineEnd>"
    type: "Part"
    description: "The content inside <li> at the end direction"
  - class: "hr"
    prop: "<TimelineItem hrBefore/hrAfter>"
    type: "Part"
    description: "Connects items with a line"
  - class: "timeline-box"
    prop: "<TimelineStart box> / <TimelineEnd box>"
    type: "Modifier"
    description: "Applies a box style to timeline-start or timeline-end"
  - class: "timeline-snap-icon"
    prop: "snapIcon"
    type: "Modifier"
    description: "snaps the icon to the start instead of middle"
  - class: "timeline-compact"
    type: "Modifier"
    description: "forces all items on one side — not supported by this component"
  - class: "timeline-horizontal"
    prop: "(default)"
    type: "Placement"
    description: "horizontal layout"
    default: true
  - class: "timeline-vertical"
    prop: "vertical"
    type: "Placement"
    description: "vertical layout"
