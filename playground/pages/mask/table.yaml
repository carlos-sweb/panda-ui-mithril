rows:
  - class: "mask"
    prop: "<Mask shape=\"...\">"
    type: "Component"
    description: "Masks the content with shape"
  - class: "mask-squircle"
    prop: "shape=\"squircle\""
    type: "Style"
    description: "squircle"
  - class: "mask-heart"
    prop: "shape=\"heart\""
    type: "Style"
    description: "heart"
  - class: "mask-hexagon"
    prop: "shape=\"hexagon\""
    type: "Style"
    description: "hexagon vertical"
  - class: "mask-hexagon-2"
    prop: "shape=\"hexagon-2\""
    type: "Style"
    description: "hexagon horizontal"
  - class: "mask-decagon"
    prop: "shape=\"decagon\""
    type: "Style"
    description: "decagon"
  - class: "mask-pentagon"
    prop: "shape=\"pentagon\""
    type: "Style"
    description: "pentagon"
  - class: "mask-diamond"
    prop: "shape=\"diamond\""
    type: "Style"
    description: "diamond"
  - class: "mask-square"
    prop: "shape=\"square\""
    type: "Style"
    description: "square"
  - class: "mask-circle"
    prop: "shape=\"circle\""
    type: "Style"
    description: "circle"
  - class: "mask-star"
    prop: "shape=\"star\""
    type: "Style"
    description: "star"
  - class: "mask-star-2"
    prop: "shape=\"star-2\""
    type: "Style"
    description: "star (bold)"
  - class: "mask-triangle"
    prop: "shape=\"triangle\""
    type: "Style"
    description: "triangle pointing top"
  - class: "mask-triangle-2"
    prop: "shape=\"triangle-2\""
    type: "Style"
    description: "triangle pointing down"
  - class: "mask-triangle-3"
    prop: "shape=\"triangle-3\""
    type: "Style"
    description: "triangle pointing left"
  - class: "mask-triangle-4"
    prop: "shape=\"triangle-4\""
    type: "Style"
    description: "triangle pointing right"
  - class: "mask-half-1"
    prop: "half={1}"
    type: "Modifier"
    description: "Crops only the first half of mask"
  - class: "mask-half-2"
    prop: "half={2}"
    type: "Modifier"
    description: "Crops only the second half of mask"
