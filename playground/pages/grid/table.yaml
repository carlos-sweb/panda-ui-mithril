rows:
  - class: "grid"
    prop: "<Grid>"
    type: "Component"
    description: "CSS Grid container"
  - class: "grid-cols-2|3|4|6|12"
    prop: "cols=\"2|3|4|6|12\""
    type: "Size"
    description: "Column count"
  - class: "grid-gap-sm|md|lg"
    prop: "gap=\"sm|md|lg\""
    type: "Size"
    description: "Gap between cells"
  - class: "grid-cell"
    prop: "<Cell>"
    type: "Part"
    description: "Grid cell spanning columns"
  - class: "cell-span-2|3|4|6|12"
    prop: "span=\"2|3|4|6|12\""
    type: "Size"
    description: "Column span"
