rows:
  - class: "fab"
    prop: "<FAB>"
    type: "Component"
    description: "Container, fixed to the bottom-right corner of the viewport"
  - class: "(trigger)"
    prop: "<FABMain>"
    type: "Part"
    description: "Focusable/clickable trigger — clicking or focusing it reveals the actions"
  - class: "(action)"
    prop: "<FABAction label=\"...\">"
    type: "Part"
    description: "An action button revealed when the FAB is open"
  - class: "fab-flower"
    type: "Modifier"
    description: "Opens actions in a quarter-circle arrangement instead of vertically — not supported by this component"
