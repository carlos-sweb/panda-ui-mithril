rows:
  - class: "drawer"
    prop: "<Drawer open onclose={...}>"
    type: "Component"
    description: "Native <dialog>-backed edge drawer — `open` drives real .showModal()/.close()"
  - class: "drawer-box"
    prop: "<DrawerBox>"
    type: "Part"
    description: "The drawer panel, docked to the chosen edge"
  - class: "drawer-backdrop"
    prop: "<DrawerBackdrop onclick={...}>"
    type: "Part"
    description: "Invisible button behind drawer-box — click to close"
  - class: "drawer-action"
    prop: "<DrawerAction>"
    type: "Part"
    description: "Container for actions, right-aligned"
  - class: "drawer-header"
    prop: "drawer({}).header"
    type: "Part"
    description: "Header slot (title + close button area)"
  - class: "drawer-body"
    prop: "drawer({}).body"
    type: "Part"
    description: "Scrollable content slot, fills remaining height"
  - class: "drawer-footer"
    prop: "drawer({}).footer"
    type: "Part"
    description: "Footer slot, right-aligned actions"
  - class: "drawer-start"
    prop: "position=\"start\" (default)"
    type: "Placement"
    description: "Drawer slides in from the start/left edge (slide-in-left)"
    default: true
  - class: "drawer-end"
    prop: "position=\"end\""
    type: "Placement"
    description: "Drawer slides in from the end/right edge (slide-in-right)"
  - class: "drawer-top"
    prop: "position=\"top\""
    type: "Placement"
    description: "Drawer slides in from the top edge (slide-in-down)"
  - class: "drawer-bottom"
    prop: "position=\"bottom\""
    type: "Placement"
    description: "Drawer slides in from the bottom edge (slide-in-up)"
  - class: "drawer-xs"
    prop: "size=\"xs\""
    type: "Size"
    description: "Panel width/height: 16rem (256px)"
  - class: "drawer-sm"
    prop: "size=\"sm\""
    type: "Size"
    description: "Panel width/height: 20rem (320px)"
  - class: "drawer-md"
    prop: "size=\"md\" (default)"
    type: "Size"
    description: "Panel width/height: 24rem (384px)"
    default: true
  - class: "drawer-lg"
    prop: "size=\"lg\""
    type: "Size"
    description: "Panel width/height: 32rem (512px)"
  - class: "drawer-xl"
    prop: "size=\"xl\""
    type: "Size"
    description: "Panel width/height: 40rem (640px)"
  - class: "drawer-full"
    prop: "size=\"full\""
    type: "Size"
    description: "Panel covers the full viewport edge (100%)"
  - prop: "size=\"55%\""
    type: "Size"
    description: "Any CSS width/height works — passed as --drawer-size"
  - prop: "persistent"
    type: "Modifier"
    description: "ESC and backdrop clicks do not close the drawer"
  - prop: "buttonClose"
    type: "Modifier"
    description: "Auto-append ButtonClose in the header (form method=\"dialog\")"
  - prop: "onopen"
    type: "Behavior"
    description: "Fired after the drawer opens (showModal)"
  - prop: "onclose"
    type: "Behavior"
    description: "Native dialog 'close' event — fired when the dialog closes"
  - prop: "onclosed"
    type: "Behavior"
    description: "Fired AFTER the exit animation completes"
  - prop: "onchange"
    type: "Behavior"
    description: "Fired on open (true) and after close (false)"
