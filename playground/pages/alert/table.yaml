rows:
  - class: "alert"
    prop: "<Alert>"
    type: "Component"
    description: "Container for displaying an important message"
  - class: "alert-info"
    prop: "color=\"info\""
    type: "Color"
    description: "Info alert color"
  - class: "alert-success"
    prop: "color=\"success\""
    type: "Color"
    description: "Success alert color"
  - class: "alert-warning"
    prop: "color=\"warning\""
    type: "Color"
    description: "Warning alert color"
  - class: "alert-error"
    prop: "color=\"error\""
    type: "Color"
    description: "Error alert color"
  - class: "alert-outline"
    prop: "variant=\"outline\""
    type: "Style"
    description: "Transparent background with a colored border"
  - class: "alert-dash"
    prop: "variant=\"dash\""
    type: "Style"
    description: "Transparent background with a dashed border"
  - class: "alert-soft"
    prop: "variant=\"soft\""
    type: "Style"
    description: "Soft background tint with no border"
  - class: "alert-horizontal"
    prop: "direction=\"horizontal\" (default)"
    type: "Direction"
    description: "Lays out content in a row"
    default: true
  - class: "alert-vertical"
    prop: "direction=\"vertical\""
    type: "Direction"
    description: "Stacks content in a column — useful on mobile"
