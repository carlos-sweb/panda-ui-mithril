rows:
  - class: "collapse"
    prop: "<Accordion name=\"...\">"
    type: "Component"
    description: "An accordion item — same underlying component as Collapse, but items sharing a `name` become a radio group where only one stays open"
  - class: "collapse-title"
    prop: "<AccordionTitle>"
    type: "Part"
    description: "Title part"
  - class: "collapse-content"
    prop: "<AccordionContent>"
    type: "Part"
    description: "Content part"
  - class: "collapse-arrow"
    prop: "arrow"
    type: "Modifier"
    description: "Adds arrow icon"
  - class: "collapse-plus"
    prop: "plus"
    type: "Modifier"
    description: "Adds plus/minus icon"
  - prop: "border"
    type: "Modifier"
    description: "base-100 background + base-300 border (the reference implementation applies this via plain utility classes, not a component class)"
