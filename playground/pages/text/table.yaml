rows:
  - class: "text"
    prop: "<Text>"
    type: "Component"
    description: "Typography helper — semantic text element with style props"
  - class: "text-size-xs"
    prop: "size=\"xs\""
    type: "Size"
    description: "Smallest — 0.75rem"
  - class: "text-size-sm"
    prop: "size=\"sm\""
    type: "Size"
    description: "Small — 0.875rem"
  - class: "text-size-md"
    prop: "size=\"md\" (default)"
    type: "Size"
    description: "Default body size — 1rem"
    default: true
  - class: "text-size-lg"
    prop: "size=\"lg\""
    type: "Size"
    description: "Large — 1.125rem"
  - class: "text-size-xl"
    prop: "size=\"xl\""
    type: "Size"
    description: "Largest — 1.25rem"
  - class: "text-neutral"
    prop: "color=\"neutral\""
    type: "Color"
    description: "Neutral color"
  - class: "text-primary"
    prop: "color=\"primary\""
    type: "Color"
    description: "Primary color"
  - class: "text-secondary"
    prop: "color=\"secondary\""
    type: "Color"
    description: "Secondary color"
  - class: "text-accent"
    prop: "color=\"accent\""
    type: "Color"
    description: "Accent color"
  - class: "text-info"
    prop: "color=\"info\""
    type: "Color"
    description: "Info color"
  - class: "text-success"
    prop: "color=\"success\""
    type: "Color"
    description: "Success color"
  - class: "text-warning"
    prop: "color=\"warning\""
    type: "Color"
    description: "Warning color"
  - class: "text-error"
    prop: "color=\"error\""
    type: "Color"
    description: "Error color"
  - class: "text-left"
    prop: "align=\"left\" (default)"
    type: "Alignment"
    description: "Left aligned"
    default: true
  - class: "text-center"
    prop: "align=\"center\""
    type: "Alignment"
    description: "Center aligned"
  - class: "text-right"
    prop: "align=\"right\""
    type: "Alignment"
    description: "Right aligned"
  - class: "text-justify"
    prop: "align=\"justify\""
    type: "Alignment"
    description: "Justified"
  - class: "text-capitalize"
    prop: "transform=\"capitalize\""
    type: "Transform"
    description: "Capitalize each word"
  - class: "text-uppercase"
    prop: "transform=\"uppercase\""
    type: "Transform"
    description: "All uppercase"
  - class: "text-lowercase"
    prop: "transform=\"lowercase\""
    type: "Transform"
    description: "All lowercase"
  - class: "text-light"
    prop: "weight=\"light\""
    type: "Weight"
    description: "Light — 300"
  - class: "text-normal"
    prop: "weight=\"normal\" (default)"
    type: "Weight"
    description: "Normal — 400"
    default: true
  - class: "text-medium"
    prop: "weight=\"medium\""
    type: "Weight"
    description: "Medium — 500"
  - class: "text-semibold"
    prop: "weight=\"semibold\""
    type: "Weight"
    description: "Semibold — 600"
  - class: "text-bold"
    prop: "weight=\"bold\""
    type: "Weight"
    description: "Bold — 700"
  - class: "text-extrabold"
    prop: "weight=\"extrabold\""
    type: "Weight"
    description: "Extrabold — 800"
  - class: "text-truncate"
    prop: "truncate"
    type: "Modifier"
    description: "Truncate with ellipsis"
  - class: "text-italic"
    prop: "italic"
    type: "Modifier"
    description: "Italic style"
  - class: "text-as-p"
    prop: "as=\"p\" (default)"
    type: "Part"
    description: "Render as <p>"
    default: true
  - class: "text-as-span"
    prop: "as=\"span\""
    type: "Part"
    description: "Render as <span>"
  - class: "text-as-div"
    prop: "as=\"div\""
    type: "Part"
    description: "Render as <div>"
