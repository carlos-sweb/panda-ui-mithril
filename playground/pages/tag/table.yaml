rows:
  - class: "tag"
    prop: "<Tag>"
    type: "Component"
    description: "Container element"
  - class: "tag-info"
    prop: "variant=\"info\""
    type: "Color"
    description: "Info variant"
  - class: "tag-success"
    prop: "variant=\"success\""
    type: "Color"
    description: "Success variant"
  - class: "tag-warning"
    prop: "variant=\"warning\""
    type: "Color"
    description: "Warning variant"
  - class: "tag-error"
    prop: "variant=\"error\""
    type: "Color"
    description: "Error variant"
  - class: "tag-outline"
    prop: "variant=\"outline\""
    type: "Style"
    description: "Outline variant"
  - class: "tag-dash"
    prop: "variant=\"dash\""
    type: "Style"
    description: "Dash variant"
  - class: "tag-soft"
    prop: "variant=\"soft\""
    type: "Style"
    description: "Soft variant"
  - class: "tag-ghost"
    prop: "variant=\"ghost\""
    type: "Style"
    description: "Ghost variant"
  - class: "tag-md"
    prop: "size=\"md\" (default)"
    type: "Size"
    description: "Medium size"
    default: true
  - class: "tag-lg"
    prop: "size=\"lg\""
    type: "Size"
    description: "Large size"
  - class: "tag-icon"
    prop: "icon={...}"
    type: "Element"
    description: "Lucide icon alongside text"
  - class: "tag-remove"
    prop: "onRemove={...}"
    type: "Action"
    description: "Shows an X button that calls onRemove"
  - class: "tag-clickable"
    prop: "clickable"
    type: "Modifier"
    description: "Renders as a button with hover state"
  - class: "tag-disabled"
    prop: "disabled"
    type: "State"
    description: "Disabled state"
