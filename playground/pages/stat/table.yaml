rows:
  - class: "stats"
    prop: "<Stats>"
    type: "Component"
    description: "Container for stat boxes"
  - class: "stat"
    prop: "<Stat>"
    type: "Component"
    description: "Container for a single stat"
  - class: "stat-title"
    prop: "<StatTitle>"
    type: "Part"
    description: "The title of the stat"
  - class: "stat-value"
    prop: "<StatValue>"
    type: "Part"
    description: "The value of the stat"
  - class: "stat-desc"
    prop: "<StatDesc>"
    type: "Part"
    description: "The description of the stat"
  - class: "stat-figure"
    prop: "<StatFigure>"
    type: "Part"
    description: "Container for a figure/icon in the stat"
  - class: "stat-actions"
    prop: "<StatActions>"
    type: "Part"
    description: "Container for buttons/actions in the stat"
  - class: "stats-horizontal"
    prop: "(default)"
    type: "Placement"
    description: "Shows stats horizontally"
    default: true
  - class: "stats-vertical"
    prop: "vertical"
    type: "Placement"
    description: "Shows stats vertically"
