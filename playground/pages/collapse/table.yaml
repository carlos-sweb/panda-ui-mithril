rows:
  - class: "collapse"
    prop: "<Collapse>"
    type: "Component"
    description: "Collapse container — click the title to toggle"
  - class: "collapse-title"
    prop: "<CollapseTitle>"
    type: "Part"
    description: "Title part"
  - class: "collapse-content"
    prop: "<CollapseContent>"
    type: "Part"
    description: "Content part"
  - class: "collapse-arrow"
    prop: "arrow"
    type: "Modifier"
    description: "Adds arrow icon"
  - class: "collapse-plus"
    prop: "plus"
    type: "Modifier"
    description: "Adds plus/minus icon"
  - class: "collapse-open"
    prop: "checked"
    type: "Modifier"
    description: "Force open (controlled)"
  - prop: "border"
    type: "Modifier"
    description: "base-100 background + base-300 border (the reference implementation applies this via plain utility classes, not a component class)"
