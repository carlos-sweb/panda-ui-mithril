rows:
  - class: "indicator"
    prop: "<Indicator>"
    type: "Component"
    description: "Container element"
  - class: "indicator-item"
    prop: "item={...} or className=\"indicator-item\""
    type: "Part"
    description: "will be placed on the corner of sibling"
  - class: "indicator-start"
    prop: "position=\"start\""
    type: "Placement"
    description: "align horizontally to the start"
  - class: "indicator-center"
    prop: "position=\"center\""
    type: "Placement"
    description: "align horizontally to the center"
  - class: "indicator-end"
    prop: "position=\"end\" (default)"
    type: "Placement"
    description: "align horizontally to the end"
    default: true
  - class: "indicator-top"
    prop: "position=\"top\" (default)"
    type: "Placement"
    description: "align vertically to top"
    default: true
  - class: "indicator-middle"
    prop: "position=\"middle\""
    type: "Placement"
    description: "align vertically to middle"
  - class: "indicator-bottom"
    prop: "position=\"bottom\""
    type: "Placement"
    description: "align vertically to bottom"
