rows:
  - class: "kbd"
    prop: "<Kbd>"
    type: "Component"
    description: "Do show a keyboard key or a shortcut key"
  - class: "kbd-xs"
    prop: "size=\"xs\""
    type: "Size"
    description: "Extra small size"
  - class: "kbd-sm"
    prop: "size=\"sm\""
    type: "Size"
    description: "Small size"
  - class: "kbd-md"
    prop: "size=\"md\""
    type: "Size"
    description: "Medium size"
    default: true
  - class: "kbd-lg"
    prop: "size=\"lg\""
    type: "Size"
    description: "Large size"
  - class: "kbd-xl"
    prop: "size=\"xl\""
    type: "Size"
    description: "Extra large size"
