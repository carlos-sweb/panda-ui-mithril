rows:
  - class: "pagination"
    prop: "<Pagination page={n} pageCount={n}>"
    type: "Component"
    description: "Data-driven pagination: renders page buttons, ellipsis and controls"
  - class: "pagination-item"
    prop: "item"
    type: "Part"
    description: "A page button or control (prev/next/edge)"
  - class: "pagination-ellipsis"
    prop: "range"
    type: "Part"
    description: "… separator shown when the page range is large"
  - class: "pagination-active"
    prop: "current page"
    type: "Modifier"
    description: "Marks the current page (aria-current=page)"
  - class: "pagination--variant_joined"
    prop: "variant=\"joined\" (default)"
    type: "Variant"
    description: "Buttons attached with collapsed borders"
    default: true
  - class: "pagination--variant_separated"
    prop: "variant=\"separated\""
    type: "Variant"
    description: "Buttons separated with a gap"
  - class: "pagination--shape_square"
    prop: "shape=\"square\" (default)"
    type: "Variant"
    description: "Square buttons"
    default: true
  - class: "pagination--shape_circle"
    prop: "shape=\"circle\""
    type: "Variant"
    description: "Round buttons (welcome-ui style)"
  - class: "pagination--size_xs|sm|md|lg|xl"
    prop: "size=\"md\""
    type: "Size"
    description: "Button scale, same as Button (default md)"
