rows:
  - class: "join"
    prop: "<Join>"
    type: "Component"
    description: "For grouping multiple items"
  - class: "join-item"
    prop: "<JoinItem>"
    type: "Part"
    description: "Item inside join. Can be a button, input, etc."
  - class: "join-horizontal"
    prop: "(default)"
    type: "Placement"
    description: "Shows items horizontally"
    default: true
  - class: "join-vertical"
    prop: "vertical"
    type: "Placement"
    description: "Shows items vertically"
