paragraphs:
    accordion: 'Accordion component for collapsible content sections. This is the same Collapse primitive — pass the same name to a group of items so opening one closes the others.'
    alert: 'Alert component for displaying important messages and notifications. All standard variants available.'
    aura: 'Aura is a border light effect that can wrap around any component — a rotating gradient border by default. Great for highlighting the one button, card, or element you want to draw attention to.'
    avatar: 'Avatar component represents a user or entity with an image or initials.'
    badge: 'Badges are used to highlight an item''s status for quick recognition.'
    breadcrumbs: 'Breadcrumbs help users understand their location in the site hierarchy.'
    button: 'Buttons allow users to take actions and make choices with a single tap. They communicate what will happen when the user touches them.'
    calendar: 'Calendar component for selecting dates. Since this project has real JS via Mithril, this is a fully working month-grid calendar (navigation, today, selection), no external dependency.'
    card: 'Cards are used to group and display content in a contained layout.'
    carousel: 'Carousel component for displaying content in a slideshow. Scroll horizontally, or drag on touch devices — native scroll-snap, no JS required.'
    chat: 'Chat bubble component for displaying message conversations.'
    checkbox: 'Checkbox component for toggling options on/off.'
    collapse: 'Collapse component for toggling visibility of content sections. Click the title to toggle — driven by a hidden native checkbox.'
    countdown: 'Countdown component for displaying remaining time. You control the ticking (via setInterval or similar) — the component itself just animates value changes.'
    diff: 'Diff component for comparing two images side by side. Drag the divider left/right.'
    divider: 'Divider component for separating content sections.'
    fab: 'Floating Action Button represents the primary action of a screen. It''s fixed to the bottom-right corner of the viewport.'
    fieldset: 'Fieldset component for grouping related form fields.'
    fileinput: 'File input component for uploading files.'
    filter: 'Filter component for filtering data with radio buttons styled as buttons.'
    footer: 'Footer component for site footers with links and information.'
    hero: 'Hero section component for prominent page headers.'
    indicator: 'Indicator component for adding badges or dots to other elements.'
    input: 'Text input component for single-line text entry.'
    join: 'Join is a container for grouping multiple items — it collapses shared borders and only rounds the outer corners.'
    kbd: 'Keyboard key component for displaying keyboard shortcuts.'
    label: 'Label component for form field labels with floating variant.'
    link: 'Link component for navigation with styled anchor tags.'
    list: 'List is a vertical layout to display information in rows.'
    loading: 'Loading indicator component for showing progress and wait states.'
    mask: 'Mask component for applying shapes to images.'
    megamenu: 'Mega menu component for large dropdown navigation menus. Hover (or focus, for keyboard users) a trigger to reveal its panel.'
    menu: 'Menu component for navigation menus and sidebars.'
    modal: 'Modal component for displaying dialog windows and overlays. Backed by a real <dialog> element.'
    navbar: 'Navbar component for site navigation headers.'
    otp: 'One-time password input component for verification codes.'
    pagination: 'Pagination component for navigating between pages of content.'
    progress: 'Progress bar component for showing completion status.'
    radialprogress: 'Radial progress component for showing circular progress indicators.'
    radio: 'Radio button component for selecting one option from a set.'
    range: 'Range slider component for selecting values within a range.'
    rating: 'Rating component for displaying star ratings. Integer scores only, with a configurable max (default 5) and a read-only static mode.'
    select: 'Select dropdown component for choosing options.'
    skeleton: 'Skeleton component for loading placeholder content.'
    stack: 'Stack component for vertical layout with consistent spacing.'
    stat: 'Stats are used to show numerical data.'
    status: 'Status indicator component for showing online/offline states.'
    steps: 'Steps component for showing progress through a multi-step process.'
    swap: 'Swap elements with a transition animation.'
    table: 'Table component for displaying data in a structured format.'
    tabs: 'Tabs component for organizing content into tabbed panels.'
    textarea: 'Textarea component for multi-line text entry.'
    themecontroller: 'Theme controller toggle for switching between light and dark themes.'
    timeline: 'Timeline component for displaying chronological events.'
    toast: 'Toast component for showing temporary notifications.'
    toggle: 'Toggle switch component for binary on/off states.'
    tooltip: 'Tooltip component for showing additional information on hover.'

