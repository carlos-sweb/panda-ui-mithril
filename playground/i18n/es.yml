landing:
  hero: Una librería de componentes Mithril.js estilizada con Panda CSS. Componentes listos para producción con patrones de diseño familiares.
  componentsCount: 57 componentes
  componentsDesc: 57 componentes listos para producción
  kbSize: 7KB
  kbSizeDesc: Bundle JS con tree-shaking y una sola hoja de estilos
  dependencies: 0
  dependenciesDesc: Sin dependencias de runtime más allá de Mithril
  orgByCategory: Organizado por categoría
  orgDesc: 57 componentes organizados por categoría. Haz clic en cualquiera para ver la demo completa.
  alert: 'Nuevo: 57 componentes, estilizados consistentemente.'
  featureNaming:
    title: Nomenclatura de clases
    desc: 'Convención de clases familiar: btn-primary, card-body, alert-soft.'
  featurePanda:
    title: Panda CSS
    desc: CSS-in-JS atómico con cero runtime. Estilos optimizados y tipados.
  featureMithril:
    title: Mithril.js
    desc: Framework rápido y ligero. Componentes con patrón de objeto literal y funciones view.
  featureIcons:
    title: Iconos Lucide
    desc: Set de iconos hermoso y consistente vía lucide-mithril. Basados en SVG, con tree-shaking.

navbar:
  themeLabels:
    light: 🌞 Claro
    dark: 🌚 Oscuro
    cupcake: 🧁 Cupcake
paragraphs:
    accordion: 'Componente de acordeón para secciones de contenido plegable. Al compartir el mismo name entre varios ítems, abrir uno cierra los demás.'
    alert: 'Componente de alerta para mostrar mensajes y notificaciones importantes. Todas las variantes disponibles.'
    aura: 'Aura es un efecto de luz en el borde que puede envolver cualquier componente — por defecto, un gradiente rotatorio. Ideal para destacar un botón, tarjeta o elemento al que quieras llamar la atención.'
    avatar: 'El componente Avatar representa un usuario o entidad con una imagen o iniciales.'
    badge: 'Los badges se usan para destacar el estado de un elemento para un reconocimiento rápido.'
    breadcrumbs: 'Las migas de pan ayudan a los usuarios a entender su ubicación en la jerarquía del sitio.'
    button: 'Los botones permiten a los usuarios realizar acciones y tomar decisiones con un solo toque. Indican lo que sucederá cuando el usuario los toque.'
    calendar: 'Componente de calendario para seleccionar fechas. Al tener JS real vía Mithril, es un calendario de cuadrícula mensual completamente funcional (navegación, hoy, selección), sin dependencias externas.'
    card: 'Las tarjetas se usan para agrupar y mostrar contenido en un diseño contenido.'
    carousel: 'Componente de carrusel para mostrar contenido en una presentación de diapositivas. Desplazamiento horizontal nativo, sin JS requerido.'
    chat: 'Componente de burbuja de chat para mostrar conversaciones de mensajes.'
    checkbox: 'Componente de casilla de verificación para alternar opciones.'
    collapse: 'Componente de colapso para alternar la visibilidad de secciones de contenido. Haz clic en el título para expandir o contraer.'
    countdown: 'Componente de cuenta regresiva para mostrar el tiempo restante. Tú controlas el tic (vía setInterval o similar).'
    diff: 'Componente de comparación para contrastar dos imágenes lado a lado. Arrastra el divisor hacia la izquierda o derecha.'
    divider: 'Componente divisor para separar secciones de contenido.'
    fab: 'El Botón de Acción Flotante representa la acción principal de una pantalla. Está fijo en la esquina inferior derecha del viewport.'
    fieldset: 'Componente Fieldset para agrupar campos de formulario relacionados.'
    fileinput: 'Componente de entrada de archivos para subir documentos.'
    filter: 'Componente de filtro para filtrar datos con botones de radio estilizados como botones.'
    footer: 'Componente de pie de página con enlaces e información.'
    hero: 'Componente de sección Hero para encabezados destacados de página.'
    indicator: 'Componente indicador para añadir insignias o puntos a otros elementos.'
    input: 'Componente de entrada de texto para texto de una sola línea.'
    join: 'Join es un contenedor para agrupar múltiples elementos — colapsa los bordes compartidos y solo redondea las esquinas exteriores.'
    kbd: 'Componente de tecla de teclado para mostrar atajos de teclado.'
    label: 'Componente de etiqueta para campos de formulario con variante flotante.'
    link: 'Componente de enlace para navegación con etiquetas de anclaje estilizadas.'
    list: 'List es un diseño vertical para mostrar información en filas.'
    loading: 'Componente de indicador de carga para mostrar progreso y estados de espera.'
    mask: 'Componente de máscara para aplicar formas a imágenes.'
    megamenu: 'Componente de mega menú para menús de navegación desplegables grandes. Pasa el cursor (o enfoca, para teclado) sobre un disparador para revelar su panel.'
    menu: 'Componente de menú para menús de navegación y barras laterales.'
    modal: 'Componente modal para mostrar ventanas de diálogo y superposiciones. Respaldado por un elemento <dialog> real.'
    navbar: 'Componente de barra de navegación para encabezados de sitio.'
    otp: 'Componente de entrada de contraseña de un solo uso para códigos de verificación.'
    pagination: 'Componente de paginación para navegar entre páginas de contenido.'
    progress: 'Componente de barra de progreso para mostrar el estado de finalización.'
    radialprogress: 'Componente de progreso radial para mostrar indicadores circulares de progreso.'
    radio: 'Componente de botón de radio para seleccionar una opción de un conjunto.'
    range: 'Componente de deslizador de rango para seleccionar valores dentro de un rango.'
    rating: 'Componente de calificación para mostrar valoraciones con estrellas. Solo puntuaciones enteras, con un máximo configurable (por defecto 5) y modo estático de solo lectura.'
    select: 'Componente de selección desplegable para elegir opciones.'
    skeleton: 'Componente de esqueleto para contenido de carga provisional.'
    stack: 'Componente de pila para diseño vertical con espaciado consistente.'
    stat: 'Las estadísticas se usan para mostrar datos numéricos.'
    status: 'Componente indicador de estado para mostrar estados en línea/desconectado.'
    steps: 'Componente de pasos para mostrar el progreso a través de un proceso de múltiples etapas.'
    swap: 'Intercambia elementos con una animación de transición.'
    table: 'Componente de tabla para mostrar datos en un formato estructurado.'
    tabs: 'Componente de pestañas para organizar contenido en paneles con pestañas.'
    textarea: 'Componente de área de texto para entrada de texto multilínea.'
    themecontroller: 'Control de tema para alternar entre temas claro y oscuro.'
    timeline: 'Componente de línea de tiempo para mostrar eventos cronológicos.'
    toast: 'Componente de notificación temporal para mostrar avisos.'
    toggle: 'Componente de interruptor para estados binarios de encendido/apagado.'
    tooltip: 'Componente de tooltip para mostrar información adicional al pasar el cursor.'

